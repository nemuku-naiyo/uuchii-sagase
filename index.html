<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うーちーをさがせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#CFE8EF; --bell:#F2B632; --miss:#D2493F; --gain:#4E9A3E;
    --panel-bg:rgba(255,253,247,.94); --panel-fg:#231F1C; --muted:#6B625A;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --panel-bg:rgba(35,31,28,.94); --panel-fg:#FFFDF7; --muted:#BDB3A8; }
  }
  :root[data-theme="dark"]{ --panel-bg:rgba(35,31,28,.94); --panel-fg:#FFFDF7; --muted:#BDB3A8; }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    height:100%; margin:0; overflow:hidden; background:var(--sky); color:var(--panel-fg);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
    display:none; grid-template-columns:1fr auto 1fr; align-items:start; gap:6px; pointer-events:none;
  }
  #hud.show{ display:grid; }
  .chip{
    pointer-events:auto; background:var(--panel-bg); color:var(--panel-fg); border:0;
    border-radius:999px; padding:8px 14px; font:inherit; font-weight:700; font-size:14px;
    box-shadow:0 2px 0 rgba(35,31,28,.18);
  }
  button.chip{ cursor:pointer; }
  .chip{ white-space:nowrap; }
  #stageLabel{ justify-self:start; font-size:13px; padding:7px 11px; }
  .hud-right{ justify-self:end; display:flex; gap:5px; }
  .hud-right .chip{ font-size:13px; padding:7px 10px; }
  /* 右上の小窓：本物がいつも回っている（覚えなくていい）。タップで大きく見る */
  .mini{ pointer-events:auto; cursor:pointer; position:relative; width:78px; height:92px; padding:0; border-radius:14px; overflow:hidden;
    background:var(--panel-bg); border:3px solid #231F1C; box-shadow:0 3px 0 rgba(35,31,28,.3); font:inherit; }
  .mini canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .mini span{ position:absolute; left:0; right:0; bottom:0; background:#231F1C; color:var(--bell); font-size:11px; font-weight:900; padding:1px 0; letter-spacing:.1em; }
  /* 時間：いちばん目立つように、大きな黄色い札にする */
  #timer{ pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; line-height:1;
    min-width:92px; padding:5px 14px 7px; border-radius:18px; background:var(--bell); color:#231F1C;
    border:3px solid #231F1C; box-shadow:0 4px 0 #231F1C; font-variant-numeric:tabular-nums; }
  #timer small{ font-size:10px; font-weight:900; letter-spacing:.1em; opacity:.75; }
  #timerNum{ font-size:30px; font-weight:900; margin-top:1px; }
  #timer{ font:inherit; }
  /* タイム中はフィールドを隠す（止めている間に探せないように） */
  #screen.pause{ background:rgba(35,31,28,.92); }
  #timer.low{ background:#E0483E; color:#fff; animation:tpulse .5s ease-in-out infinite alternate; }
  @keyframes tpulse{ to{ transform:scale(1.08); } }
  @media (prefers-reduced-motion: reduce){ #timer.low{ animation:none; } }
  button:focus-visible{ outline:3px solid var(--bell); outline-offset:3px; }

  
  
  
  
  

  #toast{ z-index:30 !important; width:max-content; max-width:90vw; text-align:center; border-radius:18px !important; line-height:1.4;
    position:fixed; left:50%; top:30%; transform:translate(-50%,-50%) scale(.9); z-index:6;
    color:#fff; font-weight:900; font-size:22px; padding:10px 20px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  #screen{
    position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:rgba(35,31,28,.18);
  }
  #screen.show{ display:flex; }
  .card{
    width:100%; max-width:360px; max-height:100%; overflow:auto;
    background:var(--panel-bg); border-radius:28px; padding:24px 22px 22px; text-align:center;
    box-shadow:0 6px 0 rgba(35,31,28,.22);
  }
  #s-title{ margin:0; font-size:clamp(30px,9vw,40px); font-weight:900; line-height:1.15; letter-spacing:.02em; }
  #s-sub{ margin:8px 0 0; color:var(--muted); font-size:15px; line-height:1.6; }
  #preview{ width:240px; height:190px; max-width:100%; margin:12px auto 4px; display:block; touch-action:none; cursor:grab; }
  #preview.hide{ display:none; }
  #s-extra{ font-size:15px; line-height:1.7; margin:4px 0 0; }
  .note{ color:var(--muted); font-size:13px; }
  .big{ font-size:30px; font-weight:900; font-variant-numeric:tabular-nums; }
  
  
  
  .btn{
    margin-top:16px; width:100%; border:0; cursor:pointer;
    background:var(--bell); color:#231F1C; font:inherit; font-weight:900; font-size:19px;
    padding:14px 18px; border-radius:999px; box-shadow:0 4px 0 #B9861A;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #B9861A; }
  .btn[hidden]{ display:none; }
  .btn.ghost{ background:transparent; color:var(--panel-fg); box-shadow:none; border:2px solid var(--panel-fg); margin-top:10px; font-size:17px; padding:11px 18px; }

  /* タイトル */
  #title{
    position:fixed; inset:0; z-index:12; display:none; flex-direction:column; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 8vh) 20px calc(env(safe-area-inset-bottom,0px) + 7vh);
    background:linear-gradient(to bottom, rgba(191,217,230,.95) 0%, rgba(191,217,230,.55) 38%, rgba(191,217,230,0) 60%);
    cursor:pointer; text-align:center;
  }
  #title.show{ display:flex; }
  .logo{ margin:0; line-height:1; font-weight:900; color:#FFFDF7; letter-spacing:.02em;
    font-size:clamp(46px,15vw,76px);
    text-shadow: 0 0 0 #231F1C, 3px 3px 0 #231F1C, -3px 3px 0 #231F1C, 3px -3px 0 #231F1C, -3px -3px 0 #231F1C,
                 0 3px 0 #231F1C, 0 -3px 0 #231F1C, 3px 0 0 #231F1C, -3px 0 0 #231F1C, 0 9px 0 #B9861A, 0 10px 0 #231F1C; }
  .logo small{ display:block; font-size:.62em; color:#F2B632; margin-bottom:.12em; }
  
  @keyframes blink{ 50%{ opacity:.35; } }
  .copy{ font-size:12px; color:#231F1C; opacity:.7; margin-top:10px; }
  /* タイトルのボタン：「さがす」を大きく主役に、観察モードは小さく控えめに */
  .start-btn{ display:block; margin:0 auto; border:4px solid #231F1C; border-radius:999px; background:var(--bell); color:#231F1C;
    font:inherit; font-weight:900; font-size:24px; padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #231F1C; letter-spacing:.04em;
    animation:startpulse 1.6s ease-in-out infinite; }
  .start-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #231F1C; animation:none; }
  @keyframes startpulse{ 50%{ transform:scale(1.05); } }
  .obs-open{ display:inline-block; margin-top:10px; border:0; border-radius:999px; background:rgba(255,253,247,.55); color:#231F1C;
    font:inherit; font-weight:700; font-size:12px; padding:5px 12px; cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ .start-btn{ animation:none; } }
  /* 観察モードの画面 */
  #obs{ position:fixed; inset:0; z-index:8; display:none; pointer-events:none; }
  #obs.show{ display:block; }
  #obs .top{ position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0; display:flex; gap:6px; align-items:center; }
  #obs .bottom{ position:absolute; left:0; right:0; bottom:0; padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px); display:flex; flex-direction:column; gap:8px; align-items:center; }
  #obs button{ pointer-events:auto; }
  #obs button[aria-pressed="true"]{ background:var(--bell); color:#231F1C; }
  #obs .top .chip{ padding:7px 9px; font-size:13px; }
  #obs .top{ gap:4px; }
  #obs .name{ font-size:13px !important;  flex:1; text-align:center; font-weight:900; font-size:15px; background:var(--panel-bg); color:var(--panel-fg); border-radius:999px; padding:7px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #obs .acts{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
  #obs .acts button{ font-size:12px; padding:6px 10px; }
  /* 観察モードのやり方（入ったときに8秒だけ。？ボタンでもう一度） */
  #obs .tip{ background:var(--panel-bg); color:var(--panel-fg); border-radius:14px; padding:8px 12px; font-size:13px; font-weight:700; line-height:1.6; text-align:left;
    box-shadow:0 3px 0 rgba(35,31,28,.2); transition:opacity .5s; pointer-events:none; }
  #obs .tip.hide{ opacity:0; }
  #obs .sel{ display:flex; align-items:center; gap:10px; }
  #obs .sel span{ background:var(--panel-bg); color:var(--panel-fg); border-radius:999px; padding:6px 12px; font-weight:900; font-size:13px; font-variant-numeric:tabular-nums; }
  body.photo #obs .top, body.photo #obs .bottom{ display:none; }

  /* メニュー */
  .menu{ display:flex; flex-direction:column; gap:10px; margin-top:14px; text-align:left; }
  .menu button{ border:0; cursor:pointer; font:inherit; color:#231F1C; background:#FFF6DC; border-radius:18px; padding:13px 16px;
    box-shadow:0 4px 0 #D9C48C; display:flex; align-items:center; gap:12px; text-align:left; }
  .menu button:active{ transform:translateY(3px); box-shadow:0 1px 0 #D9C48C; }
  .menu button.main{ background:var(--bell); box-shadow:0 4px 0 #B9861A; }
  .menu .ic{ font-size:26px; width:34px; text-align:center; }
  .menu b{ display:block; font-size:18px; font-weight:900; }
  .menu span.d{ display:block; font-size:12px; opacity:.75; margin-top:2px; }

  /* ランキング・図鑑 */
  
  
  
  
  .zukan{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .zcat{ margin-top:12px; text-align:left; }
  .zcat h3{ font-size:14px; margin:0; display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid rgba(107,98,90,.25); padding-bottom:3px; }
  .zcat h3 span{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .zukan button.sp{ background:#F3E1FF; }
  .zukan button.sp[disabled]{ background:rgba(150,110,190,.18); }
  .zukan button{ border:0; cursor:pointer; font:inherit; border-radius:14px; padding:10px 4px 8px; background:#FFF6DC; color:#231F1C; min-height:74px; }
  .zukan button.rare{ background:#FFE9A8; }
  .zukan button[disabled]{ cursor:default; background:rgba(107,98,90,.18); color:var(--muted); }
  .zukan .no{ display:block; font-size:11px; opacity:.7; }
  .zukan .nm{ display:block; font-size:13px; font-weight:900; margin-top:4px; line-height:1.3; }
  /* マーキング */
  /* 今回ちがう場所のバナー（時間の札の下） */
  #diffBar{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 78px); z-index:5; display:none;
    background:#231F1C; color:#FFFDF7; border-radius:14px; padding:5px 14px; font-size:13px; font-weight:900; pointer-events:none; width:max-content; max-width:92vw; text-align:center; line-height:1.5;
    box-shadow:0 3px 0 rgba(35,31,28,.25); }
  #diffBar b{ color:var(--bell); }
  #diffBar .c{ white-space:nowrap; }
  #diffBar.show{ display:block; }
  /* 初めて出会った特別な子の知らせ */
  #notice{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 116px); transform:translateX(-50%); z-index:9; width:min(92vw,400px);
    display:none; pointer-events:none; }
  #notice div{ background:#FFF4C7; color:#231F1C; border:3px solid #231F1C; border-radius:14px; padding:8px 12px; font-size:14px; font-weight:900; line-height:1.5; margin-bottom:6px; box-shadow:0 3px 0 rgba(35,31,28,.25); }
  #notice.show{ display:block; animation:pop .25s ease-out; }
  /* にせものを押したときの「どこが違ったか」（左下に小さく） */
  #missLog{ position:fixed; left:12px; bottom:0; z-index:6; margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex; flex-direction:column; gap:4px; pointer-events:none; max-width:55vw; }
  #missLog div{ background:var(--panel-bg); color:var(--panel-fg); border-left:4px solid var(--miss); border-radius:8px;
    padding:4px 8px; font-size:12px; font-weight:700; line-height:1.4; transition:opacity .6s; }
  #missLog div{ opacity:.6; }
  #missLog div.new{ opacity:1; border-left-color:#E0483E; box-shadow:0 2px 0 rgba(35,31,28,.2); }
  #missLog div b{ display:inline-block; min-width:1.4em; text-align:center; background:var(--miss); color:#fff; border-radius:6px; margin-right:4px; }
  #missLog div.fade{ opacity:0 !important; }
  #markBtn{
    position:fixed; right:12px; bottom:0; z-index:6; display:none;
    margin-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    border:3px solid #231F1C; border-radius:999px; padding:12px 18px; cursor:pointer;
    font:inherit; font-weight:900; font-size:16px; background:var(--panel-bg); color:var(--panel-fg);
    box-shadow:0 3px 0 rgba(35,31,28,.25);
  }
  #markBtn.show{ display:block; }
  #markBtn[aria-pressed="true"]{ background:#E0483E; color:#fff; border-color:#7A1E18; }
  body.marking #c{ box-shadow:inset 0 0 0 5px #E0483E; }
  /* ひとりごと（小さいふきだし） */
  .chat{ position:fixed; left:0; top:0; z-index:3; pointer-events:none; display:none; transform:translate(-50%,-100%);
    background:#FFFDF7; color:#231F1C; border:2px solid #231F1C; border-radius:10px; padding:2px 8px;
    font-weight:700; font-size:12px; line-height:1.5; white-space:nowrap; }
  .chat::after{ content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:5px solid transparent; border-top:6px solid #231F1C; border-bottom:0; }
  .chat.show{ display:block; }
  .chat.dash{ background:#FFE3D8; }
  .psay{ display:inline-block; position:relative; margin:10px auto -4px; background:#FFFDF7; color:#231F1C; border:2px solid #231F1C;
    border-radius:10px; padding:3px 10px; font-weight:700; font-size:13px; }
  .psay::after{ content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:5px solid transparent; border-top:6px solid #231F1C; border-bottom:0; }
  .psay[hidden]{ display:none; }
  /* にせもののセリフ */
  
  
  
  @keyframes pop{ from{ transform:translate(-50%,-80%) scale(.7); opacity:0; } }
  
  .res{ margin-top:10px; text-align:left; font-size:14px; }
  .res div{ display:flex; justify-content:space-between; gap:8px; padding:5px 4px; border-bottom:1px dashed rgba(107,98,90,.35); font-variant-numeric:tabular-nums; }
  .res div.sep{ margin-top:6px; }
  .res div.best{ border-bottom:0; font-weight:900; color:#B9861A; }
  .howto{ text-align:left; font-size:13.5px; line-height:1.6; margin-top:6px; }
  .howto h3{ font-size:15px; margin:12px 0 4px; }
  .howto ul{ margin:0; padding-left:1.2em; }
  .howto li{ margin:2px 0; }
  .ctrl{ margin-top:10px; padding:8px 10px; border-radius:12px; background:rgba(107,98,90,.1); text-align:left; font-size:12.5px; line-height:1.6; }
  .ctrl div{ display:flex; gap:6px; }
  .ctrl b{ flex:none; width:1.3em; text-align:center; }
  .stage-cats{ margin:8px 0 2px; font-size:14px; }
  .stage-cats b{ background:#231F1C; color:var(--bell); padding:2px 8px; border-radius:8px; }
  .stage-cats .c{ white-space:nowrap; }
  .rlist{ margin-top:8px; text-align:left; }
  .rrow{ display:grid; grid-template-columns:2.6em 1fr auto; grid-template-areas:'no st dt' 'no sub dt'; column-gap:8px; align-items:center;
    padding:6px 8px; border-bottom:1px dashed rgba(107,98,90,.35); font-variant-numeric:tabular-nums; }
  .rrow .no{ grid-area:no; font-weight:900; font-size:15px; text-align:center; }
  .rrow .st{ grid-area:st; font-weight:900; font-size:15px; }
  .rrow .sub{ grid-area:sub; font-size:12px; color:var(--muted); }
  .rrow .dt{ grid-area:dt; font-size:12px; color:var(--muted); }
  .rrow.me{ background:rgba(242,182,50,.25); border-radius:10px; }
  .linkbtn{ display:block; margin:10px auto 0; background:none; border:0; color:inherit; font:inherit; font-weight:900; text-decoration:underline; cursor:pointer; }
  .report{ margin-top:10px; padding:8px 10px; border-radius:12px; background:rgba(242,182,50,.2); font-size:14px; line-height:1.6; }
  @media (prefers-reduced-motion: reduce){ #toast,#hint{ transition:none; } }
</style>
</head>
<body>
<div id="err" hidden style="position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:99;background:#D2493F;color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;word-break:break-all"></div>
<script>
// 起動や動作中にエラーが起きたら、画面の上に内容を出す（原因を伝えてもらうため）
(function(){
  var box=document.getElementById('err');
  function show(m){ box.hidden=false; box.textContent=(box.textContent?box.textContent+' / ':'')+m; }
  window.addEventListener('error',function(e){ var t=e.target; if(t&&t.tagName==='SCRIPT'){ show('読み込み失敗: '+(t.src||'').split('/').pop()); return; } if(e.message) show('エラー: '+e.message+(e.lineno?' (行'+e.lineno+')':'')); },true);
  window.addEventListener('unhandledrejection',function(e){ show('エラー: '+((e.reason&&e.reason.message)||e.reason)); });
})();
</script>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chip" id="stageLabel">ステージ 1</div>
  <button class="chip" id="timer" aria-label="タイム（一時停止）"><small><span aria-hidden="true">⏸ </span><span id="timerLabel">のこり</span></small><span id="timerNum">60</span></button>
  <div class="hud-right">
    <button id="peek" class="mini" aria-label="本物を大きく見る"><canvas id="mini"></canvas><span>本物</span></button>
  </div>
</div>
<button id="markBtn" aria-pressed="false">✕ めじるし OFF</button>
<div id="missLog" aria-live="polite"></div>
<div id="diffBar" aria-live="polite"></div>
<div id="notice" role="status"></div>
<div id="obs">
  <div class="top">
    <button class="chip" id="obsBack">◀ もどる</button>
    <div class="name" id="obsName">本物のうーちー</div>
    <button class="chip" id="obsTime">昼</button>
    <button class="chip" id="obsGlasses" aria-label="メガネをかける" hidden>👓</button>
    <button class="chip" id="obsPhoto" aria-label="写真モード">📷</button>
    <button class="chip" id="obsHelp" aria-label="観察モードの遊び方">？</button>
  </div>
  <div class="bottom">
    <div class="tip" id="obsTip">👆 地面を押すと、近くの子がそっちを向くよ<br>🐄 うーちーを押すと、その子を追いかける<br>↻ ドラッグで回る／ピンチで寄る</div>
    <div class="sel"><button class="chip" id="obsPrev" aria-label="前の子">◀</button><span id="obsIdx">1 / 1</span><button class="chip" id="obsNext" aria-label="次の子">▶</button></div>
  </div>
</div>
<div id="toast"></div>

<div id="title">
  <h1 class="logo"><small>うーちーを</small>さがせ</h1>
  <div><button class="start-btn" id="startBtn">うーちーをさがす</button><div class="copy">Game Design: YMD</div><button class="obs-open" id="obsOpen">👀 観察モード</button></div>
</div>

<div id="screen">
  <div class="card">
    <h1 id="s-title"></h1>
    <p id="s-sub"></p>
    <div class="psay" id="p-say" hidden></div>
    <canvas id="preview"></canvas>
    <div id="s-extra"></div>
    <button class="btn" id="s-btn"></button>
    <button class="btn ghost" id="s-btn2" hidden></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* =====================================================================
   1. ゲーム構成（ルールとステージ）
   ---------------------------------------------------------------------
   本物のうーちーの見た目は1つに決まっている（ASSETS.canon）。

/* ---------- うーちーのモデルデータ（制作ビュー／GLB と同じ中身） ---------- */
function texFilter(t){
  const f=ASSETS.render.textureFilter==='nearest'?THREE.NearestFilter:THREE.LinearFilter;
  t.magFilter=f; t.minFilter=f; t.generateMipmaps=false; return t;
}
// 1体ぶんの部品を組み立てる（ver = 'hi' / 'lo'）
// にせものの違いは、胴体の黒斑をテクスチャに重ねるか外すか、
// 手先・足先・耳・鼻口部・クリームの UV を別の区画へずらすかで作っている。
function buildUuchiiSet(look, ver){
  const mat=uuchiiMaterial(look, ver), puppet=new THREE.Group(), parts={};
  const add=(name, swaps=[])=>{
    const p=UUCHII_MODELS[ver][name]; if (!p) return null;
    const [px,py,pz]=p.pivot;                                  // モデルは前が +Z
    const w=new THREE.Group(); w.position.set(pz, py, -px);    // ゲームは前が +X
    const m=new THREE.Mesh(uuchiiGeometry(name, swaps, ver), mat); m.rotation.y=Math.PI/2;
    w.add(m); (p.parent ? parts[p.parent] : puppet).add(w); parts[name]=w; return w;
  };
  const whiteFur=[['fur','wfur']];
  add('body'); add('head');
  add('muzzle', look.muzzle==='white' ? [['muzzle','muzzleW']] : []);
  add('earL', look.earL ? [] : [['ear','earW'], ...whiteFur]);
  add('earR', look.earR ? [] : [['ear','earW'], ...whiteFur]);
  if (look.horns){ const hs=look.hornColor==='white'?[['horn','hornW']]:[]; add('hornL',hs); add('hornR',hs); }
  add('armL', look.armL==='white' ? whiteFur : []);
  add('armR', look.armR==='white' ? whiteFur : []);
  add('legL', look.legL==='white' ? whiteFur : []);
  add('legR', look.legR==='white' ? whiteFur : []);
  const ICE_REG={choco:'creamC', strawberry:'creamS', matcha:'creamM', soda:'creamB'};
  if (look.ice !== 'none') add('iceCream', ICE_REG[look.ice] ? [['cream',ICE_REG[look.ice]]] : []);
  if (look.tail !== 'none') add('tail', look.tail==='white' ? whiteFur : []);
  const gc=GOGGLE.colors[look.goggleColor||0];
  if (look.goggles && parts.head){ const g=new THREE.Group(); g.add(new THREE.Mesh(GOGGLE.visor,gc.lens), new THREE.Mesh(GOGGLE.rim,gc.frame)); parts.head.add(g); }
  if (look.glasses && !look.goggles && parts.head) parts.head.add(GLASSES.make());
  if (ver==='lo') return mergeLo(look, puppet, mat, gc);
  return { puppet, anim:{ puppet, head:parts.head, arms:[parts.armL, parts.armR], legs:[parts.legL, parts.legR], tail:parts.tail||null } };
}
// 遠く用（200版）は、部品を1つの形にまとめる。遠くでは手足の細かい動きは見えないので、体全体の揺れだけ残す
// 形は「どの部品があるか・どの区画を使うか」だけで決まるので、同じ組み合わせは使い回す
const loMergeCache=new Map();
function mergeLo(look, puppet, mat, gc){
  const key=['muzzle','earL','earR','horns','hornColor','armL','armR','legL','legR','ice','tail','goggles','glasses'].map(k=>look[k]).join('|');
  let parts=loMergeCache.get(key);
  if (!parts){
    parts=bakeMerge(meshesIn(puppet), puppet).map(p=>({ geometry:p.geometry, role:p.material===gc.lens?'lens':p.material===gc.frame?'frame':p.material===GLASSES.frame?'gframe':p.material===GLASSES.glass?'gglass':'skin' }));
    loMergeCache.set(key,parts);
  }
  const out=new THREE.Group();
  for (const p of parts) out.add(new THREE.Mesh(p.geometry, p.role==='lens'?gc.lens:p.role==='frame'?gc.frame:p.role==='gframe'?GLASSES.frame:p.role==='gglass'?GLASSES.glass:mat));   // 形は使い回し、色だけその子のもの
  return { puppet:out, anim:{ puppet:out } };
}

// 見た目ごとのマテリアル（同じ柄は使い回す）
const uuchiiMatCache = new Map();
function uuchiiMaterial(look, ver){
  const key=[ver,look.glow,look.earL,look.earR,look.back,look.bellySpot,look.headSpot,look.browL,look.browR].join('|');
  if (uuchiiMatCache.has(key)) return uuchiiMatCache.get(key);
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  const g=cv.getContext('2d'); g.drawImage(UUCHII_IMG[ver].base,0,0);
  const layer=k=>g.drawImage(UUCHII_IMG[ver][k],0,0);   // レイヤーはアトラスと同じ大きさ
  if (look.earL) layer('earL');
  if (look.earR) layer('earR');
  if (look.back==='normal') layer('back');
  if (look.back==='small') layer('backSmall');
  if (look.back==='heart') layer('backHeart');
  if (look.back==='star') layer('backStar');
  if (look.back==='skull') layer('backSkull');
  if (look.bellySpot) layer('bellySpot');
  if (look.headSpot) layer('headSpot');
  if (look.browL) layer('browL');
  if (look.browR) layer('browR');
  const t=texFilter(new THREE.CanvasTexture(cv)); t.flipY=false;
  const m=new THREE.MeshLambertMaterial({ map:t });
  if (look.glow){ m.emissive.setHex(0xFFC040); m.emissiveIntensity=0; GLOW_MATS.push(m); }   // 光り方は loop の glowLevel() で決める
  uuchiiMatCache.set(key,m); return m;
}
// 部品の形（UVの差し替えごとに使い回す）
const uuchiiGeoCache = new Map();
function uuchiiGeometry(name, swaps, ver){
  const key=ver+'|'+name+'|'+swaps.map(s=>s.join('>')).join(',');
  if (uuchiiGeoCache.has(key)) return uuchiiGeoCache.get(key);
  const p=UUCHII_MODELS[ver][name], uv=p.uv.map(q=>q.slice());
  for (const [from,to] of swaps){
    const [fx,fy,fw,fh]=UV_REG[from], [tx,ty]=UV_REG[to];
    for (const q of uv){
      const x=q[0]*256, y=q[1]*256;
      if (x>=fx && x<=fx+fw && y>=fy && y<=fy+fh){ q[0]=(x-fx+tx)/256; q[1]=(y-fy+ty)/256; }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p.pos.flat(),3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(p.nrm.flat(),3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv.flat(),2));
  g.setIndex(p.idx);
  uuchiiGeoCache.set(key,g); return g;
}
/* ---------- 動かない物を1つの形にまとめる（描く回数を減らして軽くする） ----------
   root の中にある meshes を、マテリアルごとに1つの Mesh にまとめて返す。形は root から見た位置に焼き込む */
function bakeMerge(meshes, root){
  root.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(), m4=new THREE.Matrix4(), nm=new THREE.Matrix3(), v=new THREE.Vector3();
  const buckets=new Map();
  for (const mesh of meshes){
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes) continue;
    m4.multiplyMatrices(inv, mesh.matrixWorld); nm.getNormalMatrix(m4);
    const g=mesh.geometry, P=g.attributes.position, N=g.attributes.normal, U=g.attributes.uv, I=g.index;
    const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
    const groups=(Array.isArray(mesh.material)&&g.groups.length)?g.groups:[{start:0,count:I?I.count:P.count,materialIndex:0}];
    for (const gr of groups){
      const mat=mats[gr.materialIndex]; let b=buckets.get(mat); if (!b){ b={pos:[],nrm:[],uv:[]}; buckets.set(mat,b); }
      for (let k=gr.start;k<gr.start+gr.count;k++){
        const i=I?I.getX(k):k;
        v.fromBufferAttribute(P,i).applyMatrix4(m4); b.pos.push(v.x,v.y,v.z);
        if (N){ v.fromBufferAttribute(N,i).applyMatrix3(nm).normalize(); b.nrm.push(v.x,v.y,v.z); } else b.nrm.push(0,1,0);
        if (U) b.uv.push(U.getX(i),U.getY(i)); else b.uv.push(0,0);
      }
    }
  }
  return [...buckets].map(([mat,b])=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(b.pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(b.nrm,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(b.uv,2));
    return { geometry:g, material:mat };
  });
}
function meshesIn(obj, skip){ const out=[]; obj.traverse(n=>{ if (n.isMesh && !n.isInstancedMesh && !(skip&&skip(n))) out.push(n); }); return out; }

/* ---------- ゴーグル（写真の青い保護メガネ）。頭の子として付ける ---------- */
// 頭の付け根（首）からの位置で作る。前が +X。目の高さをぐるっと覆う曲面のレンズ＋上のふち＋耳へのつる
/* ---------- 四角メガネ（にせものの違い・観察モードの着せかえ）。頭の子として付ける ---------- */
// 目（高さ1.66、左右±0.20）の前に、黒ぶちの四角いレンズを2枚。ブリッジと、耳へのつる付き
const GLASSES=(()=>{
  const HX=0.02, HY=1.30, frame=new THREE.MeshLambertMaterial({ color:0x2A2020, side:THREE.DoubleSide });
  const glass=new THREE.MeshBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:0.18, depthWrite:false, side:THREE.DoubleSide });
  const W=0.32, H=0.22, T=0.035;   // レンズの幅・高さ・ふちの太さ（大きめ）
  const outer=new THREE.Shape([new THREE.Vector2(-W/2,-H/2),new THREE.Vector2(W/2,-H/2),new THREE.Vector2(W/2,H/2),new THREE.Vector2(-W/2,H/2)]);
  outer.holes.push(new THREE.Path([new THREE.Vector2(-W/2+T,-H/2+T),new THREE.Vector2(-W/2+T,H/2-T),new THREE.Vector2(W/2-T,H/2-T),new THREE.Vector2(W/2-T,-H/2+T)]));
  const rimGeo=new THREE.ShapeGeometry(outer), glassGeo=new THREE.PlaneGeometry(W-2*T,H-2*T), box=new THREE.BoxGeometry(1,1,1);
  function make(){
    const g=new THREE.Group();
    for (const sgn of [-1,1]){
      const z=0.20*sgn, a=Math.asin(0.2/0.56), lens=new THREE.Group();
      lens.position.set(0.675-HX, 1.69-HY, z*1.02); lens.rotation.y=-a*sgn;
      const rim=new THREE.Mesh(rimGeo,frame); rim.rotation.y=Math.PI/2; lens.add(rim);
      const gl=new THREE.Mesh(glassGeo,glass); gl.rotation.y=Math.PI/2; lens.add(gl);
      g.add(lens);
      // つる：レンズの外側から耳の方へ
      const p1=new THREE.Vector3(0.60-HX,1.75-HY,0.39*sgn), p2=new THREE.Vector3(0.08-HX,1.75-HY,0.56*sgn);
      const t=new THREE.Mesh(box,frame); t.position.copy(p1).add(p2).multiplyScalar(0.5); t.scale.set(p1.distanceTo(p2),0.035,0.035);
      t.rotation.y=-Math.atan2(p2.z-p1.z,p2.x-p1.x); g.add(t);
    }
    const br=new THREE.Mesh(box,frame); br.position.set(0.735-HX,1.72-HY,0); br.scale.set(0.04,0.04,0.14); g.add(br);   // ブリッジ（レンズとレンズの間の棒）
    return g;
  }
  return { make, frame, glass };
})();

const GOGGLE=(()=>{
  const HX=0.02, HY=1.30;                 // 頭の付け根
  const cx=0.10-HX, r=0.62, seg=6, A=75*Math.PI/180;
  const lens=[], lensI=[], rim=[], rimI=[];
  const P=(a,y,rr=r)=>[cx+rr*Math.cos(a), y-HY, rr*Math.sin(a)];
  for (let k=0;k<=seg;k++){
    const a=-A+2*A*k/seg, mid=Math.abs(k-seg/2)<0.6;
    lens.push(...P(a,mid?1.64:1.59), ...P(a,1.79));        // 真ん中は鼻の上で少し持ち上がる
    rim.push(...P(a,1.78,r+0.005), ...P(a,1.82,r+0.005));
  }
  for (let k=0;k<seg;k++){ const a=k*2; lensI.push(a,a+2,a+1, a+1,a+2,a+3); rimI.push(a,a+2,a+1, a+1,a+2,a+3); }
  // つる：レンズの両端から耳の方へ
  for (const sgn of [-1,1]){
    const e=P(sgn*A,1.80,r+0.005), b=rim.length/3;
    rim.push(e[0],e[1]-0.02,e[2], e[0],e[1]+0.02,e[2], -0.08-HX,1.78-HY,e[2]*1.02, -0.08-HX,1.82-HY,e[2]*1.02);
    rimI.push(b,b+2,b+1, b+1,b+2,b+3);
  }
  const geo=(v,i)=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(i); g.computeVertexNormals(); return g; };
  return {
    visor:geo(lens,lensI), rim:geo(rim,rimI),
    // レンズの色。look.goggleColor の番号で選ぶ（0 は写真と同じ青）
    colors:[[0x4A8BFF,0x2F63E0],[0xFF7EB6,0xE0508F],[0xFFD84A,0xD9A820],[0x5CD08A,0x2FA062],[0xFF9A4A,0xE0702A],[0xB07CFF,0x7F4FE0]].map(([l,f])=>({
      lens:new THREE.MeshLambertMaterial({ color:l, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false }),
      frame:new THREE.MeshLambertMaterial({ color:f, side:THREE.DoubleSide }) })),
  };
})();

const GLOW_CYCLE=10, GLOW_ON=3;   // 何秒ごとに光るか / 1回に光っている長さ
let glowT0=0;                       // ステージ開始の時刻。開始直後は光らず、しばらくしてから光る
function glowLevel(t){ const u=(t-glowT0)%GLOW_CYCLE, s=GLOW_CYCLE-GLOW_ON; return u>s ? Math.pow(Math.sin(Math.PI*(u-s)/GLOW_ON),2) : 0; }
const GLOW_MATS=[];

  const cv=document.createElement('canvas'); cv.width=cv.height=64; const g=cv.getContext('2d');

  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true });

/* =====================================================================
   牧場フィールド（N64風）。地面・柵・障害物・小物・遠景・時間帯
   テクスチャは全部キャンバスで描いた低解像度。色数を絞って、にじませて使う
   ===================================================================== */
const FIELD = (()=>{
  // ---------- 小さな道具 ----------
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function canvasTex(w,h,draw,repeat=false){
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d');
    draw(g,w,h); const t=texFilter(new THREE.CanvasTexture(cv));
    if (repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
    return t;
  }
  function speckle(g,w,h,cols,n,size=1){ for(let i=0;i<n;i++){ g.fillStyle=cols[(Math.random()*cols.length)|0]; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,size,size); } }

  // ---------- テクスチャ ----------
  const TEX={
    grass: canvasTex(64,64,(g,w,h)=>{ g.fillStyle='#7FAE58'; g.fillRect(0,0,w,h);
      speckle(g,w,h,['#6E9E4A','#8DBB63','#76A652','#9CC46E'],900);
      g.strokeStyle='#5E8C3E'; for(let i=0;i<40;i++){ const x=Math.random()*w,y=Math.random()*h; g.beginPath(); g.moveTo(x,y); g.lineTo(x+rnd(-1,1),y-rnd(2,4)); g.stroke(); }
      speckle(g,w,h,['#FFF6D8','#F7E36A'],6,1); },true),
    grassFar: canvasTex(32,32,(g,w,h)=>{ g.fillStyle='#6F9E4E'; g.fillRect(0,0,w,h); speckle(g,w,h,['#648F45','#7DAA58'],260); },true),
    dirt: canvasTex(32,32,(g,w,h)=>{ const gr=g.createRadialGradient(16,16,4,16,16,16); gr.addColorStop(0,'rgba(150,112,72,1)'); gr.addColorStop(0.75,'rgba(150,112,72,0.8)'); gr.addColorStop(1,'rgba(150,112,72,0)');
      g.fillStyle=gr; g.fillRect(0,0,w,h); g.globalCompositeOperation='source-atop'; speckle(g,w,h,['#7E5C3A','#A9825A','#8B6844'],160); }),
    bark: canvasTex(16,32,(g,w,h)=>{ g.fillStyle='#8A6645'; g.fillRect(0,0,w,h); g.fillStyle='#6B4E33'; for(let x=1;x<w;x+=4) g.fillRect(x,0,1,h); speckle(g,w,h,['#9B7753','#5F442C'],60); }),
    leaf: canvasTex(32,32,(g,w,h)=>{ g.fillStyle='#4F8C41'; g.fillRect(0,0,w,h); speckle(g,w,h,['#3F7535','#62A04F','#71AE5A','#3A6A30'],420,2); }),
    straw: canvasTex(32,32,(g,w,h)=>{ g.fillStyle='#E0BE62'; g.fillRect(0,0,w,h); for(let i=0;i<70;i++){ g.fillStyle=['#C9A34A','#EDD27F','#B8913C'][i%3]; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,1,(rnd(3,8))|0); } }),

  function build(world0, R){

    const ground=M(new THREE.CircleGeometry(R+1.6,24),MAT.grass); ground.rotation.x=-Math.PI/2;
    const t=TEX.grass; t.repeat.set((R+1.6)/1.6,(R+1.6)/1.6); world.add(ground);
    for (let i=0;i<Math.round(R/4);i++){ const d=M(G.dirt,MAT.dirt); d.rotation.x=-Math.PI/2; const a=rnd(0,6.3), r=rnd(1,R-1);
      d.position.set(Math.cos(a)*r,0.01,Math.sin(a)*r); d.scale.set(rnd(0.8,1.6),rnd(0.6,1.2),1); world.add(d); }

    const seg=2*fr*Math.sin(Math.PI/n);
    for (let k=0;k<n;k++){
      const a=k/n*Math.PI*2; o.position.set(Math.cos(a)*fr,0.45,Math.sin(a)*fr); o.rotation.set(0,-a,0); o.scale.set(1,1,1); o.updateMatrix(); posts.setMatrixAt(k,o.matrix);
      const am=(k+0.5)/n*Math.PI*2, rr=fr*Math.cos(Math.PI/n);
      for (const [j,y] of [[0,0.35],[1,0.7]]){ o.position.set(Math.cos(am)*rr,y,Math.sin(am)*rr); o.rotation.set(0,-am+Math.PI/2,0); o.scale.set(seg,1,1); o.updateMatrix(); rails.setMatrixAt(k*2+j,o.matrix); }
    }
    world.add(posts, rails);
    // 草むらと花（うーちーは通り抜けられる飾り）
    const tufts=new THREE.InstancedMesh(G.cross,MAT.tuft,Math.round(R*9)), flowers=new THREE.InstancedMesh(G.cross,MAT.flower,Math.round(R*3));
    for (const im of [tufts,flowers]) for (let k=0;k<im.count;k++){
      const a=rnd(0,6.3), r=Math.sqrt(Math.random())*(R+0.8); o.position.set(Math.cos(a)*r,0,Math.sin(a)*r); o.rotation.set(0,rnd(0,3),0); const s=rnd(0.7,1.3); o.scale.set(s,s,s); o.updateMatrix(); im.setMatrixAt(k,o.matrix); }
    world.add(tufts, flowers);
    // 柵の外：木立ち、牛舎とサイロ、風車（当たり判定なし）
    // 木立ちもカメラの外側に置く
    for (let i=0;i<14;i++){ const tr=OBSTACLES.tree.create(); const a=rnd(0,6.3), d=rnd(R*2.1,R*2.8); tr.position.set(Math.cos(a)*d,0,Math.sin(a)*d); const s=rnd(0.9,1.4); tr.scale.set(s,s,s); world.add(tr); }
    const ab=rnd(0,6.3), bd=Math.max(R*2.3,R+16), barn=new THREE.Group();   // カメラより外側に置いて、視界をふさがない
    const body=M(G.box,MAT.barn); body.scale.set(6,4,5); body.position.y=2; barn.add(body);
    const roofG=new THREE.CylinderGeometry(3.6,3.6,6.4,3,1); const roof=M(roofG,MAT.roof); roof.rotation.z=Math.PI/2; roof.scale.set(1,1,0.9); roof.position.y=5.0; barn.add(roof);
    const silo=M(new THREE.CylinderGeometry(1.3,1.3,7.5,8),MAT.silo); silo.position.set(0,3.75,-4.4); barn.add(silo);
    const dome=M(new THREE.SphereGeometry(1.3,8,4,0,Math.PI*2,0,Math.PI/2),MAT.roof); dome.position.set(0,7.5,-4.4); barn.add(dome);
    barn.position.set(Math.cos(ab)*bd,0,Math.sin(ab)*bd); barn.rotation.y=-ab+Math.PI/2; barn.scale.setScalar(1.3); world.add(barn);
    const aw=ab+rnd(2,3.5), wd=Math.max(R*2.6,R+20); const wm=new THREE.Group();
    const tower=M(new THREE.CylinderGeometry(0.6,1.1,7,6),MAT.white); tower.position.y=3.5; wm.add(tower);
    const cap=M(new THREE.ConeGeometry(0.9,1.2,6),MAT.roof); cap.position.y=7.6; wm.add(cap);
    const hub=new THREE.Group(); hub.position.set(0,6.8,0.95); wm.add(hub); hub.userData.keep=true;
    for (let k=0;k<4;k++){ const bl=M(G.box,MAT.wood); bl.scale.set(0.5,3.4,0.06); bl.position.y=1.7; const arm=new THREE.Group(); arm.rotation.z=k*Math.PI/2; arm.add(bl); hub.add(arm); }
    wm.position.set(Math.cos(aw)*wd,0,Math.sin(aw)*wd); wm.lookAt(0,0,0); wm.scale.setScalar(1.4); world.add(wm); windmill=hub;
    // 回る羽根と、まとめて描いている草・柵以外は、マテリアルごとに1つの形にまとめる
    const underHub=n=>{ for (let q=n;q;q=q.parent) if (q.userData&&q.userData.keep) return true; return false; };
    const merged=bakeMerge(meshesIn(world, underHub), world);
    wm.updateMatrixWorld(true); const hubHolder=new THREE.Group(); hubHolder.applyMatrix4(hub.matrixWorld.clone().premultiply(new THREE.Matrix4().copy(world.matrixWorld).invert()));
    hub.position.set(0,0,0); hub.rotation.set(0,0,0); hub.scale.set(1,1,1); hubHolder.add(hub);
    for (const c of [...world.children]) if (!c.isInstancedMesh) world.remove(c);
    for (const m of merged){ const me=new THREE.Mesh(m.geometry,m.material); me.userData.merged=true; world.add(me); }
    world.add(hubHolder);
    world.traverse(n=>{ n.raycast=()=>{}; });
  }

  return { OBSTACLES, TIMES, initStatic, setTime, build, tick };

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- にせものを作る ---------- */
// 図鑑のレア枠
const RARE = [
  { id:'glow',   name:'ひかるうーちー', sub:'エンドレスでたまに現れる、ほんのり金色でときどき光る子。タップすると時間が増える', look:{glow:true} },

  { id:'dash',   name:'せっかちうーちー', sub:'エンドレスでごくまれに現れる、めちゃくちゃ足の速い本物', look:{} },
];
const randGoggle=()=>Math.floor(Math.random()*GOGGLE.colors.length);
let stageGoggle=0;   // ゴーグルの色はステージごとに1色
// 特殊柄（rare:true）はめったに選ばれず、同じ柄は1ステージに1匹まで。usedRare はステージごとに空にする
let usedRare=new Set();
// ステージごとに「違いが出る場所」をいくつかに絞る（バナーでいつも見える）。stageCatIds が null なら絞らない
let stageCats=[], stageCatIds=null;
const feature=name=>mode!=='tut' || stageIdx>=RULES.unlock[name];   // その仕組みが、今のステージで使えるか（チュートリアルだけ順番に解放。エンドレスは最初から全部）
// 場所の数はステージが進むほど増える（=絞りこみが弱くなって難しくなる）：1〜2面は2つ、3〜4面は3つ、5〜6面は4つ、それ以降は5つ
function stageCatCount(i){ return Math.min(5, 2+Math.floor(i/2)); }
function pickStageCats(st, i=0){
  const ok=d=>d && (!st.only || st.only.includes(d.where)) && !(st.goggles && (d.group==='brow'||d.group==='eyewear')) && !(d.subtle && !feature('subtle'));   // ゴーグルで隠れる眉や、まだ出さない小さな違いは数えない
  let cats=ZUKAN_CATS.filter(([,ids])=>ids.some(id=>ok(ASSETS.diffs.find(d=>d.id===id)))).slice();
  for (let i=cats.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [cats[i],cats[j]]=[cats[j],cats[i]]; }
  const want=Math.max(st.changes>=3?3:2, stageCatCount(i)), pick=[];
  const groups=()=>new Set(pick.flatMap(([,ids])=>ids.map(id=>ASSETS.diffs.find(d=>d.id===id)).filter(ok).map(d=>d.group||d.id)));
  const kinds=()=>pick.flatMap(([,ids])=>ids.filter(id=>{ const d=ASSETS.diffs.find(x=>x.id===id); return ok(d) && !d.rare; })).length;   // めったに出ない特殊柄は数えない
  for (const c of cats){ if (pick.length>=want && groups().size>=st.changes+1 && kinds()>=Math.max(4,st.changes+2)) break; pick.push(c); }   // にせものの見た目が単調にならないよう、違いの種類を4つ以上そろえる
  if (st.focusSubtle){ for (const name of ['かお','あたま']){ const c=ZUKAN_CATS.find(([t])=>t===name); if (c && !pick.includes(c)) pick.unshift(c); } pick.length=Math.min(pick.length,3); }   // 小さな違いの練習面
  stageCats=pick.map(([t])=>t); stageCatIds=new Set(pick.flatMap(([,ids])=>ids));
}
function makeFake(changes, only, goggles=false){
  const look=buildFake(changes, only, goggles, true);
  return (look.diffs&&look.diffs.length) ? look : buildFake(changes, only, goggles, false);   // 絞りこみで作れなかったときの保険（本物と同じ見た目にしない）
}
function buildFake(changes, only, goggles, useCats){
  const look={...ASSETS.canon, goggles, goggleColor:goggles?stageGoggle:0};
  let pool=ASSETS.diffs.filter(d=>(!only || only.includes(d.where)) && !(goggles && (d.group==='brow'||d.group==='eyewear')) && !(d.subtle && !feature('subtle')) && (!useCats || !stageCatIds || stageCatIds.has(d.id)));   // ゴーグルで隠れる違いは使わない
  pool=pool.slice(); for (let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }   // かたよりのない混ぜ方
  const used=new Set(); let n=0;
  for (const d of pool){
    const grp=d.group||d.id;
    if (used.has(grp)) continue;
    if ((grp==='eyewear' && used.has('brow')) || (grp==='brow' && used.has('eyewear'))) continue;   // メガネとまゆの違いは一緒にしない（フレームでまゆが見えにくくなるので）
    if (d.rare && (usedRare.has(d.id) || Math.random()>RULES.rarePick)) continue;
    if (d.rare) usedRare.add(d.id);
    d.apply(look); used.add(grp); look.diffs=(look.diffs||[]).concat(d.id);
    if (++n>=changes) break;
  }
  return look;
}

// state: title | brief | play | peek | found | over
let state='title', stageIdx=0, startFrom=0, mobs=[], obstacles=[], R=10, target=null, targetLook=null;
let timeLeft=RULES.startTime, foundCount=0;

function disposeMob(m){ world.remove(m.obj); m.obj.userData.dispose?.(); }
function clearWorld(){ for (const m of mobs) disposeMob(m); world.traverse(n=>{ if (n.userData.merged) n.geometry.dispose(); }); world.clear(); mobs=[]; obstacles=[]; }

function freePoint(minMob){
  for (let tries=0; tries<200; tries++){
    const a=Math.random()*TAU, d=Math.sqrt(Math.random())*(R-0.8), x=Math.cos(a)*d, z=Math.sin(a)*d;
    if (obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+0.9)) continue;
    if (minMob && mobs.some(m=>Math.hypot(m.x-x,m.z-z)<minMob)) continue;
    return {x,z};
  }
  return {x:rand(-R/2,R/2), z:rand(-R/2,R/2)};
}

// 次に歩いていく場所：候補をいくつか出して、まわりのうーちーが一番少ないところを選ぶ（塊ができにくくなる）
function freeDest(me){
  let best=null, bestN=1e9;
  for (let k=0;k<10;k++){
    const p=freePoint(0);
    const n=mobs.reduce((c,o)=>c+(o!==me && !o.gone && Math.hypot((o.dest?o.dest.x:o.x)-p.x,(o.dest?o.dest.z:o.z)-p.z)<4 ? 1 : 0),0);   // 向かっている先も数える
    if (n<bestN || (n===bestN && Math.random()<0.5)){ best=p; bestN=n; }
  }
  return best;
}

function placeObstacle(kind){
  const def=FIELD.OBSTACLES[kind]; if (!def) return;
  let x=0,z=0;
  for (let t=0;t<100;t++){
    const a=Math.random()*TAU, d=rand(2,R*0.82); x=Math.cos(a)*d; z=Math.sin(a)*d;
    if (!obstacles.some(o=>Math.hypot(o.x-x,o.z-z)<3.2)) break;
  }
  const obj=def.create(); obj.position.set(x,0,z); obj.userData.obstacle=true; world.add(obj);
  obstacles.push({x,z,r:def.radius});
}

let curSt=null, speedMul=1, dashCooldown=0;
function buildStage(i){
  clearWorld();
  const st=curSt=stageParams(i);
  // エンドレスは5ステージ＋ボーナスをひと区切りに、区切りごとにみんなの動きが速くなる

  R=7+st.n*0.25;
  FIELD.build(world, R);
  FIELD.setTime(st.time||'noon', scene);
  for (const [kind,count] of Object.entries(st.obstacles)) for (let k=0;k<count;k++) placeObstacle(kind);
  // 障害物もマテリアルごとに1つの形にまとめる（当たり判定の円は obstacles に残っている）
  { const obs=world.children.filter(c=>c.userData.obstacle); const merged=bakeMerge(obs.flatMap(o=>meshesIn(o)), world);
    obs.forEach(o=>world.remove(o)); merged.forEach(m=>{ const me=new THREE.Mesh(m.geometry,m.material); me.userData.merged=true; world.add(me); }); }

  const targetIndex=Math.floor(Math.random()*st.n);
  stageGoggle=randGoggle(); missSeq=0; usedRare=new Set();
  if (!st.bonus) pickStageCats(st, i); else { stageCats=[]; stageCatIds=null; }
  targetLook={...ASSETS.canon, goggles:!!st.goggles, goggleColor:stageGoggle};   // ゴーグルはステージ全員おなじ色
  if (st.bonus){   // ボーナスステージ：本物1匹と、ひかるうーちーだらけ
    const spawnB=(look,extra)=>{ const obj=ASSETS.createUuchii(look), p=freePoint(1.6);
      const m={obj,look,isTarget:false,isGlow:false,x:p.x,z:p.z,h:Math.random()*TAU,state:'idle',timer:rand(0,2),dest:null,
               speed:rand(0.8,1.2)*speedMul,walk:0,swing:0,phase:Math.random()*10,walkTime:0,jump:0,gone:false,poof:0,...extra};
      obj.userData.mob=m; world.add(obj); mobs.push(m); return m; };
    target=spawnB(targetLook,{isTarget:true});
    for (let k=1;k<st.n;k++) spawnB({...ASSETS.canon, glow:true},{isGlow:true});
    camAnim=null; camLook.set(0,0.9,0);
    cam.max=Math.max(34,R*2.6); cam.theta=Math.random()*TAU; cam.phi=1.05; cam.r=clamp(R*1.9,cam.min,cam.max);
    return;
  }
  const spawn=(look,extra={})=>{
    const obj=ASSETS.createUuchii(look), p=freePoint(1.6);
    const m={obj,look,isTarget:false,isGlow:false,x:p.x,z:p.z,h:Math.random()*TAU,state:'idle',timer:rand(0,2),dest:null,
             speed:rand(0.55,0.85)*speedMul,walk:0,swing:0,phase:Math.random()*10,walkTime:0,jump:0,gone:false,poof:0,...extra};
    obj.userData.mob=m; world.add(obj); mobs.push(m); return m;
  };
  for (let k=0;k<st.n;k++){
    if (k===targetIndex){ target=spawn(targetLook,{isTarget:true}); continue; }
    const g = st.goggles==='all' || (st.goggles==='real' && Math.random()<0.8);   // 変装ステージは、にせものの8割もゴーグル
    spawn(makeFake(st.changes,st.only,g));
  }
  // ひかるうーちー（レア）：本物とは別に、たまに1匹だけまぎれる。少しすばしっこい
  // せっかちうーちー（ごくまれ）：本物がすごい速さで走り回る。立ち止まってもすぐ走り出す
  // どちらもエンドレス限定。せっかちうーちーは一度出たら、そのあと4ステージは出ない
  if (dashCooldown>0) dashCooldown--;
  else if (mode==='endless' && i>=1 && !st.bonus && Math.random()<RULES.dashChance){ dashCooldown=4; target.dash=true; target.speed=rand(10.4,12.0)*speedMul; }
  if (mode==='endless' && i>=1 && Math.random()<RULES.glowChance) spawn({...ASSETS.canon, glow:true, goggles:st.goggles==='all', goggleColor:stageGoggle},{isGlow:true,speed:rand(1.1,1.4)*speedMul});
  camAnim=null; camLook.set(0,0.9,0); cam.min=7;
  cam.max=Math.max(34,R*2.6); cam.theta=Math.random()*TAU; cam.phi=1.05; cam.r=clamp(R*1.9,cam.min,cam.max);
}

/* ---------- 動き ---------- */
// よちよち歩き：左右にからだを揺らしながら、足を交互に小さく出す
/* ---------- 動きのレパートリー ----------
   立ち止まったときに、ときどき次のどれかをする。どれも体の模様を隠さない動きだけ（ゲームの公平さのため）
   lick なめる / tilt 首かしげ / look きょろきょろ / doze あくびしてうとうと / hop ぴょんぴょん / wag しっぽぶんぶん */
const ACTS={ lick:{dur:1.8, say:['おいしいモー','あまいモー','ぺろぺろモー','しあわせモー']}, tilt:{dur:1.4, say:['？','んー？','なんだろモー']},
  look:{dur:2.2, say:['きょろきょろモー','だれかいるモー？']}, doze:{dur:4.2, say:['ふわぁ…','ねむねむモー','ちょっとだけ…']},
  hop:{dur:1.6, say:['ぴょんぴょんモー','たのしいモー！','はねるモー']}, wag:{dur:1.6, say:['ごきげんモー','しっぽが勝手に動くモー']} };
function startAct(m, type){
  const A=ACTS[type]; if (!A || m.gone || m.dash) return;
  m.act={ type, t:0, dur:A.dur, dir:Math.random()<0.5?-1:1 }; m.state='idle'; m.faceTo=null; m.timer=Math.max(m.timer||0, A.dur+0.3);
  if (A.say && (state==='observe' || Math.random()<0.35)) chatSay(m, pick(A.say), 1.4);
  if (type==='doze') setTimeout(()=>{ if (m.act && m.act.type==='doze') chatSay(m,'Zzz…',2.4); },1300);
}
function actPose(m, a, t){
  const A=m.act; if (!A || !a.head) return;   // 遠く用（200版）は体の揺れだけのシンプルな動き
  const tt=A.t, k=Math.min(1, tt/0.25, (A.dur-tt)/0.25);   // 始めと終わりはなめらかに
  if (k<=0) return;
  switch (A.type){
    case 'lick':   // 首を前に倒して、ぺろぺろ。手もソフトクリームを持ち上げる
      if (a.head) a.head.rotation.z+= -0.28*k - 0.07*k*Math.sin(tt*14);
      a.arms?.forEach(arm=>{ if (arm) arm.rotation.z+=0.22*k; }); break;
    case 'tilt':   // 首をかしげる
      if (a.head) a.head.rotation.x+=0.42*k*A.dir; break;
    case 'look':   // 左右をきょろきょろ
      if (a.head) a.head.rotation.y=Math.sin(tt*2.8)*0.7*k; break;
    case 'doze': { // あくび（上を向く）→ 頭がこっくりこっくり
      const up=tt<0.9 ? 1 : 0;
      if (a.head) a.head.rotation.z+= up ? 0.3*k : (-0.34+0.07*Math.sin(tt*2.2))*k;
      if (a.puppet) a.puppet.position.y-=0.04*k*(1-up); break; }
    case 'hop':    // その場でぴょんぴょん
      if (a.puppet) a.puppet.position.y+=Math.abs(Math.sin(tt*9))*0.35*k;
      if (a.legs) a.legs.forEach(l=>{ if (l) l.rotation.z+=Math.abs(Math.sin(tt*9))*0.4*k; }); break;
    case 'wag':    // しっぽをぶんぶん、体もちょっとだけ揺れる
      if (a.tail) a.tail.rotation.x=Math.sin(tt*20)*0.85*k;
      if (a.puppet) a.puppet.rotation.x+=Math.sin(tt*10)*0.05*k; break;
  }
}

function animate(m, t){
  const list=m.obj.userData.anims || (m.obj.userData.anim ? [m.obj.userData.anim] : []);
  const w=m.swing, idle=1-w, ph=m.walk;
  const sway=Math.sin(ph)*0.16*w;                 // 左右の揺れ（一歩ごとに片側へ体重がのる）
  const bob=Math.abs(Math.cos(ph))*0.05*w;        // 一歩ごとに、ほんの少しだけ沈んで浮く
  for (const a of list){
    if (a.puppet){
      a.puppet.position.y=bob+(m.jumpY||0);
      a.puppet.rotation.x=sway + Math.sin(t*1.6+m.phase)*0.07*idle;
      a.puppet.rotation.z=-0.06*w;                // わずかに前のめり
      a.puppet.position.z=Math.sin(ph)*0.04*w;    // 揺れに合わせて重心も横へ
    }
    if (a.shadow){ const k=Math.max(0.4,1-bob*1.5-(m.jumpY||0)*0.6); a.shadow.scale.set(k,1,k); }   // 高く跳ぶほど影が小さくなる
    // 足：揺れと逆側の足が前へ出る
    if (a.legs){ const [L,R]=a.legs; const step=Math.sin(ph)*0.45*w;
      if (L) L.rotation.z=Math.max(0,-step); if (R) R.rotation.z=Math.max(0,step); }
    // 手：ソフトクリームを抱えたまま、揺れと逆に小さく振れる
    a.arms?.forEach((arm,i)=>{ if (arm){ arm.rotation.x=-sway*0.5 + Math.sin(t*2+m.phase+i)*0.04*idle; arm.rotation.z=0; } });   // z は毎回0に戻す（なめる動きのあと腕が上がったままにならないように）
    if (a.tail) a.tail.rotation.x=Math.sin(t*3+m.phase)*0.35 - sway;
    if (a.head) a.head.rotation.z=-0.04+Math.sin(t*1.3+m.phase)*0.05*idle, a.head.rotation.x=-sway*0.5;   // 頭は揺れを少し打ち消す
    if (a.head && !(m.act&&m.act.type==='look')) a.head.rotation.y*=0.9;
    actPose(m, a, t);
  }
  if (m.marker) m.marker.position.y=2.5+Math.sin(t*4+m.phase)*0.08;
}
function updateMobs(dt,t){
  for (let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    if (!m.gone) continue;
    m.poof-=dt;
    const k=Math.max(0,m.poof/0.35), s=k*(1+(1-k)*0.6);
    m.obj.scale.set(s,s,s); m.obj.position.y=(1-k)*1.2;
    if (m.poof<=0){ disposeMob(m); mobs.splice(i,1); }
  }
  for (const m of mobs){
    if (m.gone) continue;
    if (m.jump>0){
      m.jump-=dt;
      m.jumpY=Math.abs(Math.sin((1.8-m.jump)*9))*0.8; m.obj.position.y=0;   // 跳ねるのは体だけ（影は地面に残る）
      m.h+=dt*4;
    } else {
      m.obj.position.y=0; m.jumpY=0;
      if (m.state==='idle'){
        m.timer-=dt; m.swing*=0.85;
        if (m.act){ m.act.t+=dt; if (m.act.t>=m.act.dur) m.act=null; }
        if (m.faceTo!=null){ const df=wrapAngle(m.faceTo-m.h); m.h+=clamp(df,-6*dt,6*dt); if (Math.abs(df)<0.02) m.faceTo=null; }   // 呼ばれた方へくるっと向く
        // 立ち止まっている場所が混んでいたら、早めに歩き出す
        if (!m.act && m.timer>0.4 && mobs.reduce((c,o)=>c+(o!==m && !o.gone && Math.hypot(o.x-m.x,o.z-m.z)<2.6?1:0),0)>=2) m.timer=0.4;
        if (m.timer<=0){ m.faceTo=null; m.dest=freeDest(m); m.state='walk'; m.walkTime=0; }
      } else {
        m.walkTime+=dt;
        const dx=m.dest.x-m.x, dz=m.dest.z-m.z;
        if (Math.hypot(dx,dz)<0.4 || m.walkTime>9){
          m.state='idle'; m.timer=m.dash?rand(0.15,0.5):rand(0.8,3.5);
          // 立ち止まったら、ときどき何かする（観察中の子はよくする）
          const chance = state==='observe' ? (m===obsSubject?0.8:0.5) : 0.4;
          if (!m.dash && Math.random()<chance){ const ks=Object.keys(ACTS); startAct(m, ks[(Math.random()*ks.length)|0]); }
        }
        else {
          const diff=wrapAngle(Math.atan2(-dz,dx)-m.h), turn=2.2*dt;
          m.h+=clamp(diff,-turn,turn);
          if (Math.abs(diff)<0.9){
            const sp=m.speed*(1-Math.abs(diff)/0.9*0.6);
            m.x+=Math.cos(m.h)*sp*dt; m.z-=Math.sin(m.h)*sp*dt; m.walk+=dt*7.5*(m.dash?2.2:1)*speedMul;   // 歩幅は小さく、足の回転は速く（よちよち）
            m.swing=Math.min(1,m.swing+dt*4);
          } else m.swing*=0.9;
        }
      }
    }
    for (const o of mobs){
      if (o===m || o.gone) continue;
      const dx=m.x-o.x, dz=m.z-o.z, d=Math.hypot(dx,dz);
      if (d>0.001 && d<2.3){ const push=(2.3-d)*0.3; m.x+=dx/d*push; m.z+=dz/d*push; }   // 近づきすぎたら離れる（前より少しだけ広く・強く）
    }
    for (const o of obstacles){
      const dx=m.x-o.x, dz=m.z-o.z, d=Math.hypot(dx,dz), lim=o.r+0.7;
      if (d<lim && d>0.001){ m.x=o.x+dx/d*lim; m.z=o.z+dz/d*lim; }
    }
    const dd=Math.hypot(m.x,m.z); if (dd>R){ m.x*=R/dd; m.z*=R/dd; }
    animate(m,t);
    m.obj.position.x=m.x; m.obj.position.z=m.z; m.obj.rotation.y=m.h;
  }
}

/* ---------- 操作 ---------- */
const pointers=new Map(); let downPos=null, moved=false, pinchStart=0, radiusStart=0, midPrev=null;
const pmid=()=>{ const [a,b]=[...pointers.values()]; return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; };
const pdist=()=>{ const [a,b]=[...pointers.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
// 片手ズーム：何もないところを1回タップして、すぐもう一度押したまま上下にスワイプ（下で拡大・上で縮小）
let groundTap=null, zoomDrag=null;
canvas.addEventListener('pointerdown',e=>{
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===1){
    downPos={x:e.clientX,y:e.clientY}; moved=false;
    zoomDrag = (groundTap && performance.now()-groundTap.t<320 && Math.hypot(e.clientX-groundTap.x,e.clientY-groundTap.y)<50) ? {y:e.clientY, r:cam.r} : null;
    groundTap=null;
  }
  else if (pointers.size===2){ pinchStart=pdist(); radiusStart=cam.r; moved=true; midPrev=pmid(); }
});
canvas.addEventListener('pointermove',e=>{
  if (!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId), dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===1){
    if (Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>8) moved=true;
    if (zoomDrag){ if (!camAnim) cam.r=clamp(zoomDrag.r*Math.exp(-(e.clientY-zoomDrag.y)*0.006),cam.min,cam.max); return; }
    if (moved && !camAnim){ cam.theta+=dx*0.006; cam.phi=clamp(cam.phi-dy*0.005,0.45,1.4); }
  } else if (pointers.size===2){
    if (camAnim) return;
    cam.r=clamp(radiusStart*pinchStart/Math.max(1,pdist()),cam.min,cam.max);
    // 2本指で動かすと、見ている場所ごと地面にそって移動する（指を動かした方向に景色がついてくる）
    const mid=pmid(), mdx=mid.x-midPrev.x, mdy=mid.y-midPrev.y; midPrev=mid;
    const k=cam.r*0.0022, fx=-Math.cos(cam.theta), fz=-Math.sin(cam.theta), rx=-fz, rz=fx;   // 画面の奥向き・右向き（地面の上）
    camLook.x+=(-mdx*rx+mdy*fx)*k; camLook.z+=(-mdx*rz+mdy*fz)*k;
    const d=Math.hypot(camLook.x,camLook.z), lim=R+1; if (d>lim){ camLook.x*=lim/d; camLook.z*=lim/d; }
  }
});
canvas.addEventListener('pointerup',e=>{
  if (pointers.size===1 && !moved && !zoomDrag && state==='observe'){
    if (document.body.classList.contains('photo')) document.body.classList.remove('photo');
    else {
      ndc.x=(e.clientX/window.innerWidth)*2-1; ndc.y=-(e.clientY/window.innerHeight)*2+1; ray.setFromCamera(ndc,camera);
      const h=ray.intersectObjects(world.children,true).find(h=>mobFromObject(h.object));
      if (h) obsFollow(mobFromObject(h.object)); else callTurn();   // 何もないところを押すと、近くの子が振り向いてくれる（観察モードだけのコミュニケーション）
    }
  }
  if (pointers.size===1 && !moved && !zoomDrag && state==='play'){
    const r=handleTap(e.clientX,e.clientY);
    if (r==='ground') groundTap={t:performance.now(), x:e.clientX, y:e.clientY};   // 次にすぐ押されたら片手ズーム
  }

/* ---------- マーキング ---------- */
// めじるしモード中にタップすると、その子の頭の上に ✕ が付く（もう一度タップで外れる）。
// 答え合わせはしない。図鑑への登録はステージクリアの時にまとめて行う。
let markMode=false;
const MARK_MAT=(()=>{
  const cv=document.createElement('canvas'); cv.width=cv.height=64; const g=cv.getContext('2d');
  g.fillStyle='#E0483E'; g.strokeStyle='#231F1C'; g.lineWidth=5;
  g.beginPath(); g.arc(32,32,26,0,Math.PI*2); g.fill(); g.stroke();
  g.strokeStyle='#FFFFFF'; g.lineWidth=8; g.lineCap='round';
  g.beginPath(); g.moveTo(21,21); g.lineTo(43,43); g.moveTo(43,21); g.lineTo(21,43); g.stroke();
  return new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), depthTest:false });
})();
function toggleMark(m){
  m.marked=!m.marked;
  if (m.marked){ const sp=new THREE.Sprite(MARK_MAT); sp.scale.set(0.6,0.6,1); sp.position.y=2.5; sp.renderOrder=10; m.obj.add(sp); m.marker=sp; }
  else if (m.marker){ m.obj.remove(m.marker); m.marker=null; }
}
const markBtn=document.getElementById('markBtn');
function setMarkMode(on){
  markMode=on; markBtn.setAttribute('aria-pressed',String(on));
  markBtn.textContent=on?'✕ めじるし ON':'✕ めじるし OFF';
  document.body.classList.toggle('marking',on);
}
let markExplained=false;
markBtn.addEventListener('click',()=>{
  if (state!=='play') return;
  setMarkMode(!markMode);
  if (markMode && !markExplained){ markExplained=true; showToast('タップした子に✕のめじるし（答えにはならない）','#231F1C'); }
});
function mobFromObject(o){ while(o){ if (o.userData.mob) return o.userData.mob; o=o.parent; } return null; }
// 何もないところをタップ：その地点の近く（RULES.callRadius）にいる子が振り向いて、少し立ち止まる
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), tapPt=new THREE.Vector3();
const RIPPLE=(()=>{ const m=new THREE.Mesh(new THREE.RingGeometry(0.75,1,24), new THREE.MeshBasicMaterial({color:0xFFFDF7, transparent:true, opacity:0, depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.visible=false; m.raycast=()=>{}; return m; })();
let rippleT=0;
function callTurn(){
  if (!ray.ray.intersectPlane(groundPlane,tapPt)) return;
  if (Math.hypot(tapPt.x,tapPt.z)>R+1.5) return;
  RIPPLE.position.set(tapPt.x,0.03,tapPt.z); RIPPLE.visible=true; rippleT=0; if (!RIPPLE.parent) scene.add(RIPPLE);
  const near=mobs.filter(m=>!m.gone && !m.dash && m.jump<=0 && Math.hypot(m.x-tapPt.x,m.z-tapPt.z)<RULES.callRadius)
                 .sort((a,b)=>Math.hypot(a.x-tapPt.x,a.z-tapPt.z)-Math.hypot(b.x-tapPt.x,b.z-tapPt.z));
  near.forEach((m,k)=>{
    m.state='idle'; m.timer=RULES.callPause+k*0.05; m.faceTo=Math.atan2(-(tapPt.z-m.z), tapPt.x-m.x);
    if (k<3) chatSay(m,pick(CALL_LINES),1.2);
  });
  if (near.length) AUDIO.play('click');
}
function handleTap(x,y){
  ndc.x=(x/window.innerWidth)*2-1; ndc.y=-(y/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(world.children,true).find(h=>{ const m=mobFromObject(h.object); return !m || !m.gone; });
  let picked=null;
  if (hit){
    picked=mobFromObject(hit.object);
    if (!picked) return; // 障害物に隠れていたら無効
  } else {
    // 指で押しやすいように、近くのうーちーを拾う
    let best=30;
    for (const m of mobs){
      if (m.gone) continue;
      tmpV.set(m.x,1,m.z).project(camera);
      const d=Math.hypot((tmpV.x+1)/2*window.innerWidth-x,(1-tmpV.y)/2*window.innerHeight-y);
      if (d<best){ best=d; picked=m; }
    }
    if (!picked) return 'ground';   // 何もないところ：ゲーム中は何もしない（呼んで振り向かせるのは観察モードだけ）
  }
  if (markMode){ toggleMark(picked); AUDIO.play('click'); tutTask('mark'); return; }
  if (picked.isGlow){
    const lbl=timeBonus(RULES.glowBonus); picked.gone=true; picked.poof=0.35; zukanAdd(['glow']); stats.glow++; AUDIO.play('glow');
    showToast(`✨ ひかるうーちー ${lbl}`,'#C9901A'); return;
  }
  if (picked.isTarget) onFound(picked);
  else {
    const lbl=timePenalty(RULES.missPenalty); picked.gone=true; picked.poof=0.35; stats.miss++; logMiss(picked); chatClear(picked); AUDIO.play('miss');
    showToast(`にせもの ${lbl}`,'var(--miss)');
  }
}

  const txt=(m.look.diffs||[]).map(id=>ASSETS.diffs.find(d=>d.id===id)).filter(Boolean).map(d=>d.say.replace(/だ?モー[！!？?]*$/,''));
  if (!txt.length) return;

function chatSay(m, text, sec=2.6, cls=''){
  if (!m.chat){ const el=document.createElement('div'); document.body.appendChild(el); m.chat={el}; chats.push(m); }
  m.chat.el.className='chat show '+cls; m.chat.el.textContent=text; m.chat.until=performance.now()+sec*1000;

  if (state!=='play' && state!=='over' && state!=='found' && state!=='observe'){ if (chats.length) chatClearAll(); return; }
  if (state==='play' || state==='observe'){
    const t=now/1000;

      nextChat=t+rand(2.2,4.2);
      const vis=mobs.filter(m=>!m.gone && !m.chat && !m.dash && inView(m));

        const extra=[...(curSt&&curSt.goggles?CHAT_STAGE.goggles:[]), ...(curSt&&curSt.bonus?CHAT_STAGE.bonus:[]), ...(state==='play'&&mode==='endless'&&timeLeft<=RULES.hurryTime?CHAT_STAGE.hurry:[])];

  chats=chats.filter(m=>{
    if (!m.chat) return false;

    main:{ bpm:104,
      mel:bars('E5 . G5 . A5 G5 E5 . | D5 . E5 . C5 . . . | E5 . G5 . A5 C6 A5 G5 | E5 . D5 . C5 . . . | '+
               'A4 . C5 . D5 . E5 . | G5 . E5 . D5 . . . | E5 . D5 C5 A4 . C5 . | D5 . . . C5 . . .'),
      bas:['C3','G2','G2','D3','C3','G2','G2','C3','F2','C3','C3','G2','F2','G2','G2','C3'] },
    bonus:{ bpm:140,
      mel:bars('G5 B5 D6 B5 G5 B5 D6 B5 | A5 C6 E6 C6 A5 C6 E6 C6 | B5 D6 G6 D6 B5 . G5 . | A5 . F#5 . D5 . . . | '+
               'G5 B5 D6 B5 G5 B5 D6 B5 | C6 E6 G6 E6 C6 . A5 . | B5 . D6 . A5 . F#5 . | G5 . . . G5 . . .'),
      bas:['G2','D3','A2','E3','G2','D3','D2','A2','G2','D3','C3','G2','D3','A2','G2','G2'] },
  };
  let cur=TRACKS.main, curName='main', tempoMul=1;
  const STEP=()=>60/(cur.bpm*tempoMul)/2;   // 8分音符ずつ進む（残り10秒からは速くなる）
  function init(){
    if (ac) { if (ac.state==='suspended') ac.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
    // 全体の音量は大きめ。音が割れないように、最後にコンプレッサーを通す
    ac=new AC(); const comp=ac.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=4; comp.connect(ac.destination);
    master=ac.createGain(); master.gain.value=muted?0:1.0; master.connect(comp);
    bgmGain=ac.createGain(); bgmGain.gain.value=0.34; bgmGain.connect(master);
    sfxGain=ac.createGain(); sfxGain.gain.value=0.7; sfxGain.connect(master);
  }
  function tone(freq,t,dur,type,vol,dest){
    if (!ac||!freq) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
  }
  function schedule(){
    while (nextT < ac.currentTime+0.12){
      const i=step%cur.mel.length, st=STEP();
      tone(N(cur.mel[i]), nextT, st*0.9, cur.melType||'square', cur.melVol||0.5, bgmGain);
      if (i%4===0) tone(N(cur.bas[(i/4)|0]), nextT, st*1.8, 'triangle', 0.9, bgmGain);
      nextT+=st; step++;
    }
  }
  function bgmStart(){ if (!ac||timer) return; step=0; nextT=ac.currentTime+0.1; timer=setInterval(schedule,25); }
  function bgmStop(){ if (timer){ clearInterval(timer); timer=null; } }
  // 曲の切りかえ。切りかえたら頭から
  function bgmTrack(name){ if (!TRACKS[name]||name===curName) return; cur=TRACKS[name]; curName=name; step=0; if (ac) nextT=ac.currentTime+0.08; }
  // 効果音
  const SE={
    start(){ const t=ac.currentTime; tone(N('E6'),t,0.08,'square',0.5,sfxGain); tone(N('B6'),t+0.07,0.16,'square',0.5,sfxGain); },   // ピコン
    click(){ tone(1300,ac.currentTime,0.035,'sine',0.35,sfxGain); },
    miss(){ const t=ac.currentTime; tone(330,t,0.09,'square',0.35,sfxGain); tone(220,t+0.08,0.14,'square',0.35,sfxGain); },
    glow(){ const t=ac.currentTime; ['E6','G6','B6','E7'].forEach((n,k)=>tone(N(n),t+k*0.05,0.12,'sine',0.35,sfxGain)); },
    found(){ const t=ac.currentTime; ['C5','E5','G5','C6'].forEach((n,k)=>tone(N(n),t+k*0.07,0.16,'square',0.4,sfxGain)); },
    clear(){ const t=ac.currentTime; [['C5',0],['E5',.1],['G5',.2],['C6',.3],['G5',.45],['C6',.55],['E6',.65]].forEach(([n,d],k)=>tone(N(n),t+d,k===6?0.6:0.14,'square',0.42,sfxGain));
             ['C3','G3','C4'].forEach((n,k)=>tone(N(n),t+0.3+k*0.18,0.3,'triangle',0.6,sfxGain)); },
    whistle(){ const t=ac.currentTime;   // 審判の笛「ピッ、ピーッ」
      [[0,0.12],[0.18,0.45]].forEach(([d,len])=>{ const o=ac.createOscillator(), g=ac.createGain(), l=ac.createOscillator(), lg=ac.createGain();
        o.type='sine'; o.frequency.value=2600; l.frequency.value=38; lg.gain.value=120; l.connect(lg); lg.connect(o.frequency);
        g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.3,t+d+0.01); g.gain.setValueAtTime(0.3,t+d+len-0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+d+len);
        o.connect(g); g.connect(sfxGain); o.start(t+d); l.start(t+d); o.stop(t+d+len+0.02); l.stop(t+d+len+0.02); }); },
    timeup(){ const t=ac.currentTime; ['G4','E4','C4'].forEach((n,k)=>tone(N(n),t+k*0.16,0.22,'square',0.38,sfxGain)); },
  };
  function play(name){ if (!ac||muted) return; SE[name]&&SE[name](); }
  function setMuted(v){ muted=v; try{ localStorage.setItem('uuchii-sagase-mute',v?'1':'0'); }catch(e){} if (master) master.gain.value=v?0:1.0; }
  // 残り時間が少ないときに曲を速くする（on のあいだ 1.35倍）
  function setHurry(on){ tempoMul=on?1.35:1; }
  return { init, bgmStart, bgmStop, bgmTrack, setHurry, play, setMuted, get muted(){ return muted; } };
})();

let obsSubject=null, obsList=[], obsIdx=0, obsTime='noon', obsGlasses=false;   // obsGlasses：着せかえのメガネ（図鑑に「メガネ」を登録すると使える）

function observeLooks(){   // 見られる子の一覧：本物＋図鑑に登録したにせもの＋レア
  const seen=new Set(load(STORE.zukan,[]));
  const list=[{ name:'本物のうーちー', look:{...ASSETS.canon} }];
  for (const d of ASSETS.diffs) if (seen.has(d.id)){ const l={...ASSETS.canon, diffs:[d.id]}; d.apply(l); list.push({ name:d.name, look:l }); }
  for (const r of RARE) if (seen.has(r.id)) list.push({ name:r.name, look:{...ASSETS.canon, ...r.look}, dash:r.id==='dash' });
  return list;
}
function spawnObs(entry, x, z){
  const obj=ASSETS.createUuchii(entry.look);
  const m={obj,look:entry.look,isTarget:false,isGlow:!!entry.look.glow,x,z,h:Math.random()*TAU,state:'idle',timer:rand(0.5,2),dest:null,
           speed:entry.dash?rand(6,7):rand(0.5,0.8),walk:0,swing:0,phase:Math.random()*10,walkTime:0,jump:0,gone:false,poof:0,entry, dash:!!entry.dash};
  obj.userData.mob=m; world.add(obj); mobs.push(m); return m;
}
function startObserve(){
  AUDIO.init(); AUDIO.bgmTrack('observe'); AUDIO.bgmStart();
  state='observe'; titleEl.classList.remove('show'); screen.classList.remove('show'); hud.classList.remove('show'); markBtn.classList.remove('show');
  obsList=observeLooks(); obsIdx=0;
  clearWorld(); curSt={ time:obsTime }; speedMul=1;
  R=9; FIELD.build(world, R); FIELD.setTime(obsTime, scene);
  for (const [kind,count] of Object.entries({tree:2, bush:1, hay:1})) for (let k=0;k<count;k++) placeObstacle(kind);
  { const obs=world.children.filter(c=>c.userData.obstacle); const merged=bakeMerge(obs.flatMap(o=>meshesIn(o)), world);
    obs.forEach(o=>world.remove(o)); merged.forEach(m=>{ const me=new THREE.Mesh(m.geometry,m.material); me.userData.merged=true; world.add(me); }); }
  // まわりの子（集めた子からランダムに）
  for (let k=0;k<4;k++){ const p=freePoint(1.6); spawnObs(obsList[(Math.random()*obsList.length)|0], p.x, p.z); }
  glowT0=performance.now()/1000;

  setSubject(obsList[0]);
  const canGlasses=load(STORE.zukan,[]).includes('glasses'); $('obsGlasses').hidden=!canGlasses; $('obsGlasses').setAttribute('aria-pressed',String(obsGlasses));
  obsEl.classList.add('show'); showObsTip();
}
let obsTipT=0;
function showObsTip(){ const t=$('obsTip'); t.classList.remove('hide'); clearTimeout(obsTipT); obsTipT=setTimeout(()=>t.classList.add('hide'),8000); }
function setSubject(entry){   // 追いかける子を、この見た目の子に入れかえる
  entry={...entry, look:{...entry.look, glasses:obsGlasses||entry.look.glasses}};
  if (obsSubject){ chatClear(obsSubject); disposeMob(obsSubject); mobs.splice(mobs.indexOf(obsSubject),1); }
  const p=obsSubject?{x:obsSubject.x,z:obsSubject.z}:{x:0,z:0};
  obsSubject=spawnObs(entry, p.x, p.z);
  $('obsName').textContent=entry.name; $('obsIdx').textContent=`${obsIdx+1} / ${obsList.length}`;
  cam.theta=-obsSubject.h;   // 正面から
}
function obsFollow(m){   // フィールドの子をタップ：その子を追いかける

}

const RANK_MAX=10;
const rankCmp=(a,b)=>b.stage-a.stage || b.found-a.found || a.miss-b.miss || a.date-b.date;
function addRank(e){   // 記録を入れて、何位だったかを返す（入らなければ null）
  const list=load(STORE.rank,[]); list.push(e); list.sort(rankCmp);
  const pos=list.indexOf(e); save(STORE.rank,list.slice(0,RANK_MAX));
  return pos<RANK_MAX ? pos+1 : null;
}
