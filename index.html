/* ---------- 図鑑（形だけ。にせものをタップすると登録） ---------- */
// 図鑑のカテゴリ（にせものの違いを、体のどこが違うかで分ける）
const ZUKAN_CATS=[
  ['あたま',        ['earL','earR','headSpot']],
  ['かお',          ['browNone','browBoth','browSwap','muzzle']],
  ['つの',          ['horns','hornWhite']],
  ['アクセサリー',   ['glasses']],
  ['おしり',        ['backNone','backSmall','backHeart','backStar','backSkull']],
  ['しっぽ',        ['tailWhite','tailNone']],
  ['おなか',        ['bellySpot']],
  ['手足',          ['armL','armR','legL','legR']],
  ['ソフトクリーム', ['iceNone','iceChoco','iceBerry','iceMatcha','iceSoda']],
];
function showZukan(){
  state='menu';
  const seen=new Set(load(STORE.zukan,[]));
  const card=(d,no)=> seen.has(d.id)
      ? `<button data-act="z:${d.id}"${d.rare?' class="sp"':''}><span class="no">${no}${d.rare?' 特殊柄':''}</span><span class="nm">${d.name}</span></button>`
      : `<button disabled${d.rare?' class="sp"':''}><span class="no">${no}${d.rare?' 特殊柄':''}</span><span class="nm">？？？</span></button>`;
  let n=0, html=`<div class="zcat"><h3>本物</h3><div class="zukan"><button data-act="z:canon"><span class="no">No.00</span><span class="nm">本物のうーちー</span></button></div></div>`;
  const listed=new Set();
  for (const [title,ids] of ZUKAN_CATS){
    const ds=ids.map(id=>ASSETS.diffs.find(d=>d.id===id)).filter(Boolean); ds.forEach(d=>listed.add(d.id));
    const got=ds.filter(d=>seen.has(d.id)).length;
    html+=`<div class="zcat"><h3>${title}<span>${got} / ${ds.length}</span></h3><div class="zukan">${ds.map(d=>card(d,`No.${String(++n).padStart(2,'0')}`)).join('')}</div></div>`;
  }
  const rest=ASSETS.diffs.filter(d=>!listed.has(d.id));   // カテゴリに入れ忘れた違いがあっても、ここに出る
  if (rest.length) html+=`<div class="zcat"><h3>そのほか</h3><div class="zukan">${rest.map(d=>card(d,`No.${String(++n).padStart(2,'0')}`)).join('')}</div></div>`;
  const rareN=RARE.filter(r=>seen.has(r.id)).length;
  html+=`<div class="zcat"><h3>レア<span>${rareN} / ${RARE.length}</span></h3><div class="zukan">`+RARE.map((r,i)=> seen.has(r.id)
      ? `<button data-act="z:${r.id}" class="rare"><span class="no">★${String(i+1).padStart(2,'0')}</span><span class="nm">${r.name}</span></button>`
      : `<button disabled class="rare"><span class="no">★${String(i+1).padStart(2,'0')}</span><span class="nm">？？？</span></button>`).join('')+`</div></div>`;
  const got=[...seen].filter(id=>ASSETS.diffs.some(d=>d.id===id)).length;
  showScreen({ title:'図鑑', sub:`にせもの ${got} / ${ASSETS.diffs.length}　レア ${rareN} / ${RARE.length}　めじるしを付けたにせものが、ステージクリアの時に登録されるよ`,
    extra:html, btn2:'もどる', action2:showMenu });
}
function showZukanEntry(id){
  const look={...ASSETS.canon}; let name='本物のうーちー', sub='これを探しているんだ';
  const d=ASSETS.diffs.find(x=>x.id===id), r=RARE.find(x=>x.id===id);
  if (r){ Object.assign(look,r.look); name=r.name; sub=r.sub; }
  if (d){ d.apply(look); name=d.name; sub={front:'前から見ると分かる',side:'横から見ると分かる',back:'背中を見ると分かる',top:'上から見ると分かる'}[d.where]; }
  showScreen({ title:name, sub, preview:look, btn2:'図鑑にもどる', action2:showZukan });
}

let stats={miss:0,glow:0,playTime:0};
/* ---------- 続きから（エンドレスだけ） ----------
   ステージが始まるとき・やめたとき・アプリを閉じたときに、その時点の進み具合を保存する。
   時間切れになったら消す。続きはそのステージの最初から、保存したときの残り時間で始まる */
function saveResume(){
  if (mode!=='endless' || !['brief','play','peek','pause'].includes(state)) return;
  save(STORE.resume,{ stageIdx, timeLeft:Math.max(1,timeLeft), stats, foundCount, dashCooldown, at:Date.now() });
}
function clearResume(){ try{ localStorage.removeItem(STORE.resume); }catch(e){} }
function resumeGame(){
  const r=load(STORE.resume,null); if (!r) return showMenu();
  mode='endless'; stageIdx=r.stageIdx; timeLeft=r.timeLeft; stats=r.stats||{miss:0,glow:0,playTime:0}; foundCount=r.foundCount||0; dashCooldown=r.dashCooldown||0;
  zukanReport=''; setMarkMode(false); buildStage(stageIdx); brief();
}
document.addEventListener('visibilitychange',()=>{ if (document.hidden) saveResume(); });
window.addEventListener('pagehide',saveResume);

function startGame(){ if (mode==='endless') clearResume(); if (isTut()) startFrom=0; dashCooldown=0; stats={miss:0,glow:0,playTime:0}; stageIdx=startFrom; timeLeft=RULES.startTime; foundCount=0; zukanReport=''; setMarkMode(false); buildStage(stageIdx); brief(); }

function brief(){
  setTimeout(saveResume,0);   // ステージの始まりで保存
  const st=curSt;
  state='brief';
  AUDIO.bgmTrack(st.bonus?'bonus':'main');
  showScreen({ title:isTut()?`れんしゅう ${stageIdx+1} / ${TUT_STAGES.length}`:st.bonus?'ボーナスステージ':`ステージ ${stageIdx+1}`, sub:st.desc, preview:targetLook,
    extra:(st.bonus?`<div>光っていないのが本物。本物をタップするとボーナス終了</div>`:`<div>これが本物のうーちー。<b>${st.n}匹</b> の中に1匹だけいるよ</div>`)+
      (stageCats.length?`<div class="stage-cats">${hintText()}</div>`:'')+
      `<div class="note">ゲーム中も右上の小窓に、本物の今の姿がいつも映るよ。タップで大きく見られる</div>`+ctrlHTML()+zukanReport,
    btn:isTut()?'やってみる':`さがす（残り ${Math.ceil(timeLeft)}秒）`, action:startPlay });
}
// ひかるうーちー・せっかちうーちーに初めて出会ったときだけ、何をすればいいかを知らせる
function firstMeetNotice(){
  const seen=new Set(load('uuchii-sagase-met',[])), msgs=[];
  if (mobs.some(m=>m.isGlow) && !seen.has('glow') && !curSt.bonus){ msgs.push(`✨ どこかに、ひかるうーちーがいる！ ほんのり金色の子をタップすると +${RULES.glowBonus}秒`); seen.add('glow'); }
  if (target && target.dash && !seen.has('dash')){ msgs.push('💨 せっかちうーちーがあらわれた！捕まえて！'); seen.add('dash'); }
  if (!msgs.length) return;
  save('uuchii-sagase-met',[...seen]);
  noticeEl.innerHTML=msgs.map(m=>`<div>${m}</div>`).join(''); noticeEl.classList.add('show');
  clearTimeout(noticeT); noticeT=setTimeout(()=>noticeEl.classList.remove('show'),7000);
}
let noticeT=0;
// チュートリアルの「やってみよう」カード（その面のあいだ出しっぱなし）
let tutTaskDone=false;
function showLesson(){
  tutTaskDone=false; clearTimeout(noticeT);
  noticeEl.innerHTML=`<div>🔰 ${curSt.lesson}</div>`; noticeEl.classList.add('show');
}
function tutTask(kind){   // 教えている操作をやってみたら「できた！」
  if (!isTut() || tutTaskDone || curSt.task!==kind) return;
  tutTaskDone=true; showToast('できた！','var(--gain)');
  noticeEl.innerHTML=`<div>🔰 ${curSt.lesson}</div><div>✅ できたね！ あとは本物を見つけてタップしよう</div>`;
}
function onTutClear(){
  state='clear'; save(STORE.tut,true); AUDIO.play('clear');
  showScreen({ title:'チュートリアル クリア！', sub:'これで準備OK。本番のエンドレスに挑戦しよう', preview:ASSETS.canon, say:'いっしょにあそぶモー',
    extra:`<div class="res"><div><span>本番のエンドレスは</span><b>持ち時間${RULES.startTime}秒</b></div><div><span>にせものをタップすると</span><b>−${RULES.missPenalty}秒</b></div><div><span>本物を見つけると</span><b>+${RULES.findBonus}秒</b></div></div>`+zukanReport,
    btn:'エンドレスへ', action:()=>{ mode='endless'; startFrom=0; startGame(); }, btn2:'メニューへ', action2:showMenu });
}
function startPlay(){
  state='play'; hideScreen(); setMarkMode(markMode);
  stageLabel.textContent=curSt.bonus?'★ボーナス':isTut()?`🔰 れんしゅう${stageIdx+1}/${TUT_STAGES.length}`:({ta:'⏱ ',endless:'∞ '}[mode]||'')+`ステージ${stageIdx+1}`;
  if (isTut()) showLesson();
  timerLabelEl.textContent=isTut()?'れんしゅう':'のこり';
  glowT0=performance.now()/1000; nextChat=glowT0+1.5;
  firstMeetNotice(); updateDiffBar();
}
// 操作のまとめ（「本物・操作」の画面と、ステージ開始の画面に出す）
const ctrlHTML=()=>`<div class="ctrl">
  <div><b>👆</b>ドラッグで見回す／ピンチで拡大／2本指で移動</div>
  <div><b>☝</b>片手ズーム：地面を2回タップして、2回目で押したまま上下（下で拡大）</div>
  <div><b>★</b>本物を見つけたらタップ（にせものは${isTut()?'練習なので時間はへらない':'−'+RULES.missPenalty+'秒'}）</div>
  ${feature('mark')?'<div><b>✕</b>「めじるし」ONでタップすると✕を付けられる</div>':''}
</div>`;
// 時間の札をタップすると「タイム」（一時停止）。タイマーが止まり、フィールドは隠れる
$('timer').addEventListener('click',()=>{
  if (state!=='play') return;
  state='pause';
  showScreen({ title:'タイム', sub:'タイマーは止まってるよ', extra:ctrlHTML(),
    btn:'つづける', action:()=>{ screen.classList.remove('pause'); state='play'; hideScreen(); setMarkMode(markMode); },
    btn2:'やめてメニューへ', action2:()=>{ saveResume(); screen.classList.remove('pause'); showMenu(); } });
  screen.classList.add('pause');
});
$('peek').addEventListener('click',()=>{
  if (state!=='play') return;
  tutTask('peek');
  state='peek';
  showScreen({ title:'本物のうーちー', sub:'見ている間もタイマーは進むよ', preview:targetLook, extra:ctrlHTML(), btn:'さがしにもどる', action:()=>{ state='play'; hideScreen(); setMarkMode(markMode); } });
});

// ステージクリア時：めじるしを付けていたにせものを図鑑に登録して、次の画面で報告する
let zukanReport='';
function registerMarks(){
  const marked=mobs.filter(x=>x.marked && !x.gone);
  const ids=new Set(); marked.filter(x=>!x.isTarget).forEach(x=>(x.look.diffs||[]).forEach(i=>ids.add(i)));
  const before=new Set(load(STORE.zukan,[])); const fresh=[...ids].filter(i=>!before.has(i));
  zukanAdd([...ids]);
  const lines=[];
  if (fresh.length) lines.push(`図鑑に新しく登録：${fresh.map(i=>ASSETS.diffs.find(d=>d.id===i).name).join('、')}`);
  else if (ids.size) lines.push('めじるしを付けたにせものは、もう図鑑に載ってたよ');
  if (marked.some(x=>x.isTarget)) lines.push('本物にもめじるしを付けてたよ');
  zukanReport = lines.length ? `<div class="report">${lines.join('<br>')}</div>` : '';
}
function onFound(m){
  state='found'; foundCount++; AUDIO.play('found'); chatSay(m, pick(FOUND_LINES), 2.2); m.jump=1.8; m.state='idle'; m.timer=3; m.speed=0.7;   // 捕まえたら落ち着く
  registerMarks(); markBtn.classList.remove('show'); document.body.classList.remove('marking');
  if (m.look.goggles && curSt.goggles==='real'){ const had=load(STORE.zukan,[]).includes('goggle'); zukanAdd(['goggle']); if (!had) zukanReport+='<div class="report">図鑑に新しく登録：変装うーちー</div>'; }
  if (!isTut() && !curSt.bonus) timeLeft+=RULES.findBonus;
  if (m.dash){
    const dl=timeBonus(RULES.dashBonus);
    const had=load(STORE.zukan,[]).includes('dash'); zukanAdd(['dash']);
    if (!had) zukanReport+='<div class="report">図鑑に新しく登録：せっかちうーちー</div>';
    showToast(`せっかちうーちーを捕まえた！ +${RULES.findBonus+RULES.dashBonus}秒`,'var(--gain)');
  } else if (!curSt.bonus) showToast(isTut()?'本物みつけた！':`本物みつけた +${RULES.findBonus}秒`,'var(--gain)');
  if (isTut()){ noticeEl.classList.remove('show'); if (stageIdx===TUT_STAGES.length-1){ setTimeout(onTutClear,1400); return; } }
  if (curSt.bonus) showToast('ボーナスおわり！','var(--gain)');
  setTimeout(()=>{ stageIdx++; buildStage(stageIdx); brief(); },1400);
}
function onTimeUp(){
  clearResume();
  state='over'; markBtn.classList.remove('show'); document.body.classList.remove('marking');
  // 本物はその場で止まって、カメラが正面から寄っていく。着いたら跳ねる
  target.state='idle'; target.timer=99; target.swing=0;
  camAnim={ t0:performance.now(), dur:1400,
    from:{ theta:cam.theta, phi:cam.phi, r:cam.r, look:camLook.clone() },
    to:{ theta:-target.h, phi:1.25, r:5.5, look:new THREE.Vector3(target.x,1.0,target.z) } };
  const line=pick(TIMEUP_LINES);
  chats.filter(x=>x!==target).forEach(chatClear); chats=chats.filter(x=>x===target);
  setTimeout(()=>{ target.jump=1.8; chatSay(target,line,2.2); },1300);
  showToast('時間切れ','var(--miss)'); AUDIO.play('timeup');
  let isBest=false, rankEntry=null, rankPos=null;
  if (mode==='endless'){
    isBest=stageIdx+1>readBest();
    if (isBest) save(STORE.endless,stageIdx+1);
    rankEntry={ stage:stageIdx+1, found:foundCount, miss:stats.miss, glow:stats.glow, time:Math.round(stats.playTime), date:Date.now() };
    rankPos=addRank(rankEntry);
  }
  setTimeout(()=>{
    const mmss=t=>`${Math.floor(t/60)}分${String(Math.floor(t%60)).padStart(2,'0')}秒`;
    showScreen({ title:mode==='endless'?'リザルト':'時間切れ', sub:'時間切れ…本物はこの子だった', preview:targetLook, say:line,
      extra:`<div class="note">${mode==='endless'?'エンドレス　とどいたステージ':'ステージ'}</div><div class="big">${mode==='endless'?'∞ ':''}ステージ ${stageIdx+1}</div>`+
        `<div class="res">`+
        `<div><span>本物を見つけた</span><b>${foundCount}回</b></div>`+
        `<div><span>にせものをタップ</span><b>${stats.miss}回</b></div>`+
        `<div><span>ひかるうーちー</span><b>${stats.glow}匹</b></div>`+
        `<div><span>プレイ時間</span><b>${mmss(stats.playTime)}</b></div>`+
        (mode==='endless'?`<div class="best"><span>自己ベスト</span><b>${isBest?'更新！ ':''}ステージ ${Math.max(readBest(),stageIdx+1)}</b></div>`:'')+
        (rankPos?`<div class="best"><span>ランキング</span><b>${rankPos}位にランクイン！</b></div>`:'')+
        `</div>`+(rankEntry?`<button class="linkbtn" data-act="rankview">ランキングを見る</button>`:''),
      btn:'もう一回', action:startGame, btn2:'メニューへ', action2:showMenu });
    lastRankDate=rankEntry?rankEntry.date:null;
  },3200);
}
/* ---------- ループ ---------- */
let lastT=performance.now(), wasHurry=false;
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; const t=now/1000;
  if (state==='play' || state==='peek'){
    stats.playTime+=dt;
    if (isTut()){ /* チュートリアルは時間制限なし */ }
    else {
      timeLeft=Math.max(0,timeLeft-dt);
      if (state==='peek') sSub.textContent=`見ている間もタイマーは進むよ（残り ${Math.ceil(timeLeft)}秒）`;
      if (timeLeft<=0){ if (state==='peek') hideScreen(); onTimeUp(); }
    }
  }
  updateMobs(dt,t);
  if (state==='title' || state==='menu') cam.theta+=dt*0.08;
  if (state==='observe' && obsSubject){ camLook.x+=(obsSubject.x-camLook.x)*Math.min(1,dt*4); camLook.z+=(obsSubject.z-camLook.z)*Math.min(1,dt*4); camLook.y+=(1.0-camLook.y)*Math.min(1,dt*4); }
  if (camAnim){
    const k=Math.min(1,(now-camAnim.t0)/camAnim.dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;   // ゆっくり動き出して、ゆっくり止まる
    cam.theta=camAnim.from.theta+wrapAngle(camAnim.to.theta-camAnim.from.theta)*e;
    cam.phi=camAnim.from.phi+(camAnim.to.phi-camAnim.from.phi)*e;
    cam.r=camAnim.from.r+(camAnim.to.r-camAnim.from.r)*e;
    camLook.lerpVectors(camAnim.from.look,camAnim.to.look,e);
  }
  camera.position.set(camLook.x+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta), camLook.y+cam.r*Math.cos(cam.phi), camLook.z+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta));
  camera.lookAt(camLook);
  updateChats(now);
  diffBar.classList.toggle('show', !!stageCats.length && (state==='play'||state==='peek'||state==='found') && !curSt?.bonus);
  { const tb=Math.max(timerEl.getBoundingClientRect().bottom, $('peek').getBoundingClientRect().bottom), top=Math.round((hud.classList.contains('show')?tb:0)+8);   // 時間の札のすぐ下に（端末で札の高さが違っても重ならない）
    if (diffBar.dataset.top!=top){ diffBar.style.top=top+'px'; diffBar.dataset.top=top; }
    const nb=diffBar.classList.contains('show')?diffBar.getBoundingClientRect().bottom+8:top;
    if (noticeEl.dataset.top!=Math.round(nb)){ noticeEl.style.top=Math.round(nb)+'px'; noticeEl.dataset.top=Math.round(nb); } }
  if (state!=='play' && state!=='peek' && noticeEl.classList.contains('show') && state!=='found') noticeEl.classList.remove('show');
  if (RIPPLE.visible){ rippleT+=dt; const k=rippleT/0.5; RIPPLE.scale.setScalar(0.3+k*RULES.callRadius); RIPPLE.material.opacity=0.7*(1-k); if (k>=1) RIPPLE.visible=false; }
  FIELD.tick(dt);
  // ひかるうーちー：ふだんは普通の見た目で、10秒ごとに3秒かけて、ふわっと明るくなって消える（開始直後は光らない）
  const gl=(curSt&&curSt.bonus) ? 0.45+0.35*Math.pow(Math.sin(t*1.2),2) : glowLevel(t);
  // ひかるうーちーは、光っていない間もほんのり金色（本物と見分けられるように）。光るとさらに明るく
  for (const gm of GLOW_MATS){ gm.emissiveIntensity=0.1+0.25*gl; gm.color.setRGB(1, 0.94-0.07*gl, 0.76-0.16*gl); }
  GLOW_HALO.opacity=0.4*gl;
  renderer.render(scene,camera);
  if (pShown){
    if (pIdle>0) pIdle-=dt; else if (pDrag===null) pPivot.rotation.y+=dt*0.5;
    pRenderer.render(pScene,pCam);
  } else if (state==='play' && hud.classList.contains('show') && target){   // ゲーム中は右上の小窓に、本物の今の姿（動きもそのまま）
    if (miniFor!==target){ target.obj.traverse(o=>o.layers.enable(1)); miniFor=target; sizeMini(); }
    miniAng+=dt*0.8; const r=5.4;   // まわりをゆっくり回りながら映す
    miniCam.position.set(target.x+Math.cos(miniAng)*r, 2.2, target.z+Math.sin(miniAng)*r); miniCam.lookAt(target.x,1.0,target.z);
    const bg=scene.background, fg=scene.fog; scene.background=null; scene.fog=null;   // 空の色と霧は小窓には入れない
    miniRenderer.render(scene,miniCam); scene.background=bg; scene.fog=fg;
  }
  const tv=isTut()?'∞':String(Math.ceil(timeLeft)); if (timerNumEl.textContent!==tv) timerNumEl.textContent=tv;
  // 残り15秒で笛が鳴って、音楽が速くなる（時間が増えて15秒をこえたら元に戻り、また下回ると鳴る）
  const hurry=!isTut() && (state==='play'||state==='peek') && timeLeft<=RULES.hurryTime;
  if (hurry && !wasHurry) AUDIO.play('whistle');
  wasHurry=hurry; AUDIO.setHurry(hurry);
  timerEl.classList.toggle('low',!isTut() && timeLeft<=RULES.hurryTime);   // 笛が鳴るのと同時に赤くなって脈打つ
  requestAnimationFrame(loop);
}

/* ---------- 起動時の自己チェック ----------
   設定（ステージ・違い・図鑑のカテゴリ・ルール）に欠けや食い違いがないかを確かめる。
   見つかったら画面上部の赤い帯に出す（メモの書き方ミスなどで設定が黙って消えても、すぐ気づけるように） */
function selfCheck(){
  const bad=[], has=(o,k)=>o[k]!==undefined && o[k]!==null;
  const checkStage=(st,label)=>{
    for (const k of ['n','changes','time','obstacles']) if (!has(st,k)) bad.push(`${label}の${k}がない`);
    if (!(st.desc||st.lesson)) bad.push(`${label}の説明がない`);
    if (st.time && !FIELD.TIMES[st.time]) bad.push(`${label}の時間帯「${st.time}」が不明`);
    for (const k of Object.keys(st.obstacles||{})) if (!FIELD.OBSTACLES[k]) bad.push(`${label}の障害物「${k}」が不明`);
  };
  STAGES.forEach((st,i)=>checkStage(st,`ステージ${i+1}`));
  TUT_STAGES.forEach((st,i)=>checkStage(st,`れんしゅう${i+1}`));
  const keep=mode; mode='endless'; for (let i=0;i<30;i++) checkStage(stageParams(i),`エンドレス${i+1}`); mode=keep;
  const ids=new Set();
  for (const d of ASSETS.diffs){
    for (const k of ['id','where','name','say','apply']) if (!has(d,k)) bad.push(`違い${d.id||'?'}の${k}がない`);
    if (ids.has(d.id)) bad.push(`違い${d.id}が重複`); ids.add(d.id);
  }
  const inCat=new Set(ZUKAN_CATS.flatMap(([,l])=>l));
  for (const id of ids) if (!inCat.has(id)) bad.push(`違い${id}が図鑑のカテゴリにない`);
  for (const id of inCat) if (!ids.has(id)) bad.push(`図鑑のカテゴリの${id}が存在しない`);
  for (const [k,v] of Object.entries(RULES)) if (typeof v==='number' && !isFinite(v)) bad.push(`RULES.${k}が数字でない`);
  if (bad.length){ const b=document.getElementById('err'); b.hidden=false; b.textContent='設定エラー: '+bad.slice(0,5).join(' / ')+(bad.length>5?` ほか${bad.length-5}件`:''); }
  return bad;
}
selfCheck();

requestAnimationFrame(loop);
assetsReady.then(()=>{ buildStage(0); showTitle(); })
  .catch(e=>{ const b=document.getElementById('err'); b.hidden=false; b.textContent='起動できませんでした: '+(e&&e.message||e); });
})();
</script>
